<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>1 ใน นวนิยาย — จำลองชีวิตยุทธภพและเทพเซียน</title>
<link href="https://fonts.googleapis.com/css2?family=Itim&family=Srisakdi:wght@700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4eee2;--card:#fffdf8;--w:#fff;--ink:#2a2838;--mut:#8a8496;--pink:#ff6b9a;--pinkd:#d94a7a;--line:#2a2838;--grid:#0000000a;
--good:#e6f7e9;--bad:#ffe5e8;--epic:#fff3d6;--myth:#ffe1ee;--peerb:#eef1f6;--think:#dceaff;--tb1:#dceaff;--tb2:#f5e6cc;--tb3:#ffd6de;--tb4:#ece0ff;--me:#ffe9f0;
--c0:#8a8f98;--c1:#2f7de1;--c2:#8b4fd8;--c3:#e08a00;--c4:#e0245e}
body.dark{--bg:#14131b;--card:#1f1d29;--w:#272433;--ink:#ece8f4;--mut:#9a95ab;--line:#d9d4e6;--grid:#ffffff08;
--good:#1e3326;--bad:#3a1f25;--epic:#3a3018;--myth:#3d1d2c;--peerb:#24232e;--think:#1e2a40;--tb1:#1e2a40;--tb2:#3a3020;--tb3:#3d1d2c;--tb4:#2d2340;--me:#3a1f2c;
--c0:#a0a6ae;--c1:#6aa8ff;--c2:#b48cff;--c3:#ffb43c;--c4:#ff5f8a}
body.mono{--bg:#ffffff;--card:#ffffff;--w:#fff;--ink:#000;--mut:#666;--pink:#000;--pinkd:#444;--line:#000;--grid:#0000000d;
--good:#f2f2f2;--bad:#e2e2e2;--epic:#fff;--myth:#fff;--peerb:#f7f7f7;--think:#efefef;--tb1:#fff;--tb2:#fff;--tb3:#e8e8e8;--tb4:#f2f2f2;--me:#efefef;
--c0:#777;--c1:#333;--c2:#222;--c3:#111;--c4:#000}
body.mono .bub.epic,body.mono .bub.myth{border-width:3px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:16px 16px;color:var(--ink);font-family:'Itim',sans-serif;font-size:15px;transition:background .3s}
.px{font-family:'Silkscreen','Itim',monospace}
button{font-family:inherit;cursor:pointer;color:inherit}
input{color:var(--ink)}
.screen{display:none;max-width:560px;margin:0 auto}.screen.on{display:block}
.box{background:var(--card);border:2px solid var(--line);box-shadow:3px 3px 0 var(--line);border-radius:6px}
.pbtn{background:var(--pink);color:#fff;border:2px solid var(--line);box-shadow:0 4px 0 var(--line);border-radius:8px;padding:13px 26px;font-size:19px}
body.mono .pbtn{color:#fff}
.pbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pbtn:disabled{opacity:.45}
.gbtn{background:var(--card);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);border-radius:8px;padding:10px 16px;font-size:15px}
.gbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.t0{color:var(--c0)}.t1{color:var(--c1)}.t2{color:var(--c2)}.t3{color:var(--c3)}.t4{color:var(--c4)}
/* title */
#title{padding:6vh 16px 40px;text-align:center;position:relative}
.topbtns{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;width:100%;max-width:440px;margin:0 auto 12px}
.topbtns .cb{font-size:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.15;min-height:48px;white-space:nowrap;overflow:hidden}
.topbtns .cb i{font-style:normal;font-size:17px}
.topbtns #themeBtn,.topbtns #sfxBtn{font-size:18px}

.globe{width:150px;height:150px;margin:0 auto 6px;image-rendering:pixelated}
#title .big{font-size:56px;line-height:1;text-shadow:3px 3px 0 var(--pink)}
#title .big small{display:block;font-size:22px;text-shadow:none;margin-top:6px;color:var(--mut)}
.counter{margin:18px auto;display:inline-block;padding:8px 16px;font-size:13px}
.counter b{font-size:20px;color:var(--pink)}
.opts{text-align:left;padding:14px;margin:16px 0}
.opts .lb{font-size:13px;color:var(--mut);margin:8px 0 6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg4{display:grid;grid-template-columns:1fr 1fr}
.seg4 button{min-width:0}
.opts .lb.sep{margin-top:16px;padding-top:12px;border-top:1px dashed var(--line)}
.hint{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--w);border:1.5px solid var(--line);display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.5;animation:popin .3s ease-out}
.hint .hic{font-size:22px;line-height:1.1;flex:0 0 auto}
.hint b{display:block;font-size:14px;margin-bottom:1px}
.hint .hd{color:var(--mut)}
.hint .htg{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.hint .htg span{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--card);border:1px solid var(--line);white-space:nowrap}
.hint .htg span.g{border-color:#3a9a4a;color:#3a9a4a}.hint .htg span.r{border-color:#d0404a;color:#d0404a}
.seg button{flex:1;min-width:30%;background:var(--w);border:2px solid var(--line);border-radius:6px;padding:8px 4px;font-size:14px}
body.xian{background-image:linear-gradient(180deg,rgba(150,120,255,.10),transparent 40%)}
@keyframes popin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.popin{animation:popin .35s ease-out}
body.jade{--bg:#0f1f1a;--card:#16302a;--w:#1c3a33;--ink:#e2f5ec;--mut:#8fb8a8;--line:#9fe0c4;--grid:#ffffff08;--pink:#3ad09a;--pinkd:#1fa878;
--good:#1e3a2a;--bad:#3a1f25;--epic:#2e3a1c;--myth:#1c3a3a;--peerb:#18302a;--think:#1c2e3a;--tb1:#1c2e3a;--tb2:#2e3020;--tb3:#3a2028;--tb4:#203a38;--me:#1e3a30;--c0:#9ab8ac;--c1:#5ad0ff;--c2:#9affc8;--c3:#ffd060;--c4:#ff6a8a}
body.ember{--bg:#1a0c0e;--card:#2a1216;--w:#34181c;--ink:#f8e4e4;--mut:#b88a8e;--line:#ff8a8a;--grid:#ffffff06;--pink:#ff3a4a;--pinkd:#c81e2e;
--good:#1e3326;--bad:#4a1a1e;--epic:#3a2a14;--myth:#4a1428;--peerb:#2a1618;--think:#2a1a30;--tb1:#2a1a30;--tb2:#3a2a14;--tb3:#4a1428;--tb4:#341c3a;--me:#3a1a20;--c0:#b89a9a;--c1:#ff8a5a;--c2:#ff5ad0;--c3:#ffc040;--c4:#ff3a5a}
body.gold{--bg:#1c160a;--card:#2a210e;--w:#342a12;--ink:#fff4d8;--mut:#c8b080;--line:#ffd870;--grid:#ffffff07;--pink:#ffc030;--pinkd:#d8981a;
--good:#2a3014;--bad:#3a1e18;--epic:#4a3a10;--myth:#3a2a10;--peerb:#2a2210;--think:#2a2a1a;--tb1:#2a2a1a;--tb2:#4a3a10;--tb3:#3a2a10;--tb4:#3a3018;--me:#3a2e10;--c0:#c8b890;--c1:#ffe080;--c2:#ffb0ff;--c3:#ffd040;--c4:#ff8040}
body.fs-s .bub,body.fs-s .quiet,body.fs-s #modal p,body.fs-s .opt{font-size:12.5px}
body.fs-l .bub,body.fs-l .quiet{font-size:16.5px}body.fs-l #modal p,body.fs-l .opt,body.fs-l .item,body.fs-l .hint{font-size:16px}body.fs-l .fc{font-size:15px}
#tut{position:fixed;inset:0;z-index:999}
.tut-hole{position:fixed;border-radius:10px;box-shadow:0 0 0 9999px rgba(10,8,20,.74);border:2px solid #ffd040;pointer-events:none;transition:all .25s}
.tut-tip{position:fixed;left:14px;right:14px;max-width:420px;margin:0 auto;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 6px 24px #0008;animation:popin .3s;font-size:14px;line-height:1.5}
.seg button.on{background:var(--ink);color:var(--bg)}
.legend{margin-top:22px;text-align:left}
.legend h4{margin-bottom:8px}
.legend .box{padding:9px 11px;margin-bottom:8px;font-size:13px}
.cont{display:block;margin:12px auto 0}
/* birth */
#birth{padding:18px 14px 30px}
#birth h2{text-align:center;font-size:26px;margin-bottom:10px}
.hcard{padding:16px}
.hcard .row1{display:flex;gap:12px;align-items:center}
.avatar{width:64px;height:64px;border:2px solid var(--line);border-radius:6px;background:#ffe3ec;image-rendering:pixelated;flex:0 0 auto}
.hcard input{font-family:inherit;font-size:22px;border:none;border-bottom:2px dashed var(--line);background:none;width:100%;padding:2px 0}
.trait{display:flex;justify-content:space-between;align-items:flex-start;padding:9px 0;border-top:2px dotted var(--grid);opacity:0;transform:translateX(-6px);transition:.35s}
.trait.show{opacity:1;transform:none}
.trait .k{font-size:12px;color:var(--mut)}.trait .v{font-size:17px}.trait .d{font-size:12px;color:var(--mut)}
.trait .o{font-size:11px;white-space:nowrap;border:2px solid currentColor;border-radius:20px;padding:1px 7px;margin-left:8px}
.oddsbig{text-align:center;margin:14px 0;padding:12px}
.oddsbig .n{font-size:30px;color:var(--pink)}
.brow{display:flex;gap:8px}.brow>*{flex:1}
/* game */
#game{height:100dvh;display:none;flex-direction:column;padding:8px 10px 0}
#game.on{display:flex}
.top{padding:10px 12px;display:flex;gap:10px;align-items:center;cursor:pointer}
.top .ag{font-size:34px;line-height:1;min-width:58px;text-align:center}
.top .ag small{display:block;font-size:11px;color:var(--mut)}
.top .info{flex:1;min-width:0}
.top .nm{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{font-size:12px;color:var(--mut);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{font-size:16px;color:var(--mut);align-self:flex-start}
.tag{display:inline-block;font-size:11px;padding:0 7px;border-radius:10px;border:1.5px solid var(--line);margin:2px 3px 0 0;background:var(--w)}
.tag.ธรรมะ{background:var(--tb1)}.tag.อธรรม{background:var(--tb2)}.tag.มาร{background:var(--tb3)}.tag.ow{background:var(--tb4)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:7px}
.st{background:var(--card);border:2px solid var(--line);border-radius:5px;padding:3px 4px;font-size:11px;text-align:center}
.st b{display:block;font-size:13px}
.hpbar{height:6px;border:1.5px solid var(--line);border-radius:3px;margin-top:2px;background:var(--w);overflow:hidden}
.hpbar i{display:block;height:100%;background:#ff5d73}
body.mono .hpbar i{background:#000}
.realm{font-size:12px;margin-top:2px}
.arcs{font-size:11.5px;color:var(--mut);margin-top:6px;line-height:1.5}
.peers{display:flex;gap:5px;margin-top:7px;overflow-x:auto}
.peer{flex:1 0 22%;background:var(--card);border:2px solid var(--line);border-radius:5px;padding:4px 5px;font-size:10.5px;line-height:1.3;min-width:80px;text-align:left}
.peer b{font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.peer.dead{opacity:.45}
.feed{flex:1;overflow-y:auto;margin-top:8px;padding:4px 2px 10px}
.yr{text-align:center;margin:12px 0 6px;font-size:12px}
.yr span{background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:1px 10px}
.bub{background:var(--card);border:2px solid var(--line);border-radius:4px 12px 12px 12px;padding:7px 10px;margin:5px 30px 5px 0;line-height:1.5;font-size:14px;animation:pop .25s;width:fit-content;max-width:88%}
.bub.good{background:var(--good)}.bub.bad{background:var(--bad)}.bub.epic{background:var(--epic);box-shadow:2px 2px 0 var(--c3)}.bub.myth{background:var(--myth);box-shadow:2px 2px 0 var(--c4)}
.bub.peer{background:var(--peerb);border-style:dashed;font-size:12.5px;color:var(--mut)}
.bub.think{margin:5px 0 5px auto;border-radius:12px 4px 12px 12px;background:var(--think);font-style:italic}
.quiet{font-size:12.5px;color:var(--mut);margin:4px 0 4px 4px;padding-left:8px;border-left:3px solid var(--grid);line-height:1.5}
.quiet b{color:var(--ink);font-weight:normal}
@keyframes pop{from{opacity:0;transform:translateY(5px)}}
.ctrl{padding:8px 0 10px;background:var(--bg)}
.ybar{height:12px;border:2px solid var(--line);border-radius:5px;background:var(--w);overflow:hidden}
.ybar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--pink) 0 8px,var(--pinkd) 8px 16px)}
.crow{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.crow .ybar{flex:1 1 100%!important;order:-1;height:9px}
.crow .cb{flex:1 1 0;min-width:0;padding:6px 0;text-align:center}
.cb{background:var(--card);border:2px solid var(--line);border-radius:6px;padding:5px 9px;font-size:13px;box-shadow:0 2px 0 var(--line);position:relative}
.cb.on{background:var(--ink);color:var(--bg)}
.cb:active{transform:translateY(1px)}
.cb.dot:after{content:'';position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;background:var(--c2);border:2px solid var(--line)}
.focus{display:flex;gap:5px;margin-top:7px;overflow-x:auto;scrollbar-width:none}
.focus::-webkit-scrollbar{display:none}
.fc{flex:0 0 auto;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:5px 11px;font-size:13px;white-space:nowrap}
.fc.on{background:var(--pink);color:#fff;box-shadow:inset 0 -3px 0 var(--pinkd)}
.fc:disabled{opacity:.3}
/* modal */
.mask{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
.mask.on{display:flex}
.modal{background:var(--card);border:2px solid var(--line);box-shadow:5px 5px 0 var(--line);border-radius:8px;width:100%;max-width:500px;max-height:86vh;overflow:auto;padding:16px;animation:pop .2s;position:relative}
.modal h3{font-size:22px;margin-bottom:6px;padding-right:30px}
.modal p{line-height:1.6;margin-bottom:10px}
.xbtn{position:absolute;top:10px;right:10px;width:30px;height:30px;border:2px solid var(--line);border-radius:6px;background:var(--w);font-size:15px}
.opt{display:block;width:100%;text-align:left;background:var(--w);border:2px solid var(--line);border-radius:6px;padding:10px;margin-bottom:7px;font-size:15px;box-shadow:0 2px 0 var(--line)}
.opt small{display:block;color:var(--mut);font-size:12px}
.opt:active{transform:translateY(2px);box-shadow:none}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}
.mgrid .opt{margin:0;text-align:center;padding:12px 6px}
.item{border:2px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:6px;background:var(--w)}
.item .h{display:flex;justify-content:space-between;gap:8px;align-items:center}
.item p{font-size:12.5px;color:var(--mut);margin:3px 0 0}
.item button{background:var(--pink);color:#fff;border:2px solid var(--line);border-radius:5px;padding:3px 10px}
.ta{width:100%;font-family:inherit;font-size:16px;border:2px solid var(--line);border-radius:6px;padding:9px;margin-bottom:10px;background:var(--w)}
.gacha{text-align:center;padding:14px 0}
.spin{width:80px;height:80px;margin:0 auto 10px;border:4px solid var(--line);border-radius:8px;background:repeating-conic-gradient(var(--pink) 0 25%,#ffd36b 0 50%);animation:sp .6s steps(8) infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.tag2{font-size:11px;color:var(--mut)}
.ulog h4{margin:12px 0 4px;font-size:16px}
.ulog h4 span{font-size:11px;color:var(--mut);font-weight:normal}
.ulog li{margin-left:18px;font-size:13.5px;line-height:1.6}
.new{display:inline-block;background:var(--pink);color:#fff;font-size:10px;padding:0 6px;border-radius:8px;margin-left:4px;vertical-align:middle}
/* end */
#end{padding:18px 14px 40px}
.rec{padding:16px}
.rec .ep{font-size:30px;text-align:center;color:var(--pink);text-shadow:2px 2px 0 var(--line)}
.rec .nm{text-align:center;font-size:20px}
.rec .yrs{text-align:center;color:var(--mut);font-size:13px;margin-bottom:10px}
.rec h5{font-size:14px;margin:12px 0 4px;border-bottom:2px dotted var(--grid)}
.rec li{margin-left:18px;font-size:13.5px;line-height:1.6}
.five{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:14px}
.five .box{padding:8px;font-size:12px;line-height:1.5}
.five .box.me{grid-column:1/-1;background:var(--me)}
.scene{position:relative;margin-top:7px;border:2px solid var(--line);border-radius:6px;overflow:hidden;box-shadow:3px 3px 0 var(--line);background:#000}
.scene canvas{width:100%;display:block;image-rendering:pixelated;aspect-ratio:160/56}
.scap{position:absolute;left:5px;top:4px;font-size:11px;background:#000a;color:#fff;padding:1px 7px;border-radius:8px}
body.mono .scene canvas{filter:grayscale(1) contrast(1.1)}
.opt.sel{border-color:var(--pink);box-shadow:0 0 0 2px var(--pink);background:var(--myth)}
.bub.world{background:var(--ink);color:var(--bg);max-width:100%;width:100%;margin-right:0;text-align:center;border-radius:6px}
.bub.sys{background:var(--syBg);color:var(--syT);border-color:var(--syA);box-shadow:0 0 8px var(--syA6)}
.bub.sys.up{box-shadow:0 0 12px var(--syAc)}.bub.sys.fail{border-color:#ff5d73;box-shadow:0 0 8px #ff5d7366}
.sysbox{background:var(--syBg);color:var(--syT);border:2px solid var(--syA);border-radius:6px;padding:12px;box-shadow:0 0 14px var(--syA8) inset}
.sysbox h4{margin:12px 0 6px;color:var(--syB);font-size:14px}
.sysg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.sysb{background:var(--syM);color:var(--syW);border:1.5px solid var(--syA);border-radius:5px;padding:6px 4px;font-size:12px}
.sysb small{display:block;font-size:10px;opacity:.8}.sysb:disabled{opacity:.35}
.sysq{background:var(--syQ);border:1px solid var(--syL);border-radius:5px;padding:7px 8px;margin-bottom:5px;font-size:12.5px;line-height:1.5}
#sysBtn{background:var(--syBg);color:var(--syT);border-color:var(--syA)}
.tl{border-left:3px solid var(--line);margin:6px 0 6px 4px;padding-left:8px}
.tl summary{cursor:pointer;font-size:14px;padding:3px 0;list-style:none}.tl summary::-webkit-details-marker{display:none}
.tl summary:before{content:'▸ ';color:var(--mut)}.tl[open] summary:before{content:'▾ '}
.tl ul{list-style:none;margin:2px 0 6px}.tl li{margin:0!important;font-size:13px;line-height:1.55;padding:3px 0;border-bottom:1px dotted var(--grid)}
.tl li b{display:inline-block;min-width:30px;color:var(--pink)}.tl li.tlend{font-weight:bold}
.spark{margin:8px 0}.sk-t{font-size:13px;margin-bottom:2px}.spark svg{width:100%;height:74px;color:var(--ink);touch-action:none;display:block}
.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:7px 14px;border-radius:6px;z-index:99;font-size:14px;display:none}
.ybar{position:relative}.ybar i{background:repeating-linear-gradient(90deg,var(--pink) 0 calc(100%/12 - 2px),var(--pinkd) calc(100%/12 - 2px) calc(100%/12))!important}
.crow .ybar{height:16px!important}#ymon{position:absolute;inset:0;font-size:10px;line-height:12px;text-align:center;color:var(--ink,#222);text-shadow:0 0 3px #fff8;pointer-events:none}
.bub.sum{opacity:.8;font-size:.86em;background:transparent;border-style:dashed}
.chtop{display:flex;justify-content:space-between;align-items:center;margin:-4px 0 4px}.minb{background:none;border:0;color:inherit;opacity:.75;text-decoration:underline;cursor:pointer;font:inherit;font-size:.85em}
.chfoot{margin-top:10px;font-size:.8em;opacity:.85;display:flex;flex-direction:column;gap:6px}.chfoot label{display:flex;gap:6px;align-items:center}

 {v:'5.2',d:'7 พ.ย. 2026',l:['🎨 ฉากหลังวาดใหม่ละเอียดขึ้น 3 เท่า: ท้องฟ้าไล่สีเนียน ดวงอาทิตย์ จันทร์ ดาวกะพริบ เมฆลอย นกบิน · ภูเขามีแสงเงา ยอดหิมะ หมอก · หญ้าไหว ดอกไม้ ใบไม้ร่วง หิมะ · ต้นไม้ทรงพุ่มไหวตามลม · บ้านมีกระเบื้อง ชายคาเชิด หน้าต่างแสงไฟ ควันไฟลอย · ในบ้านมีลายไม้ ภาพแขวน เทียน','🚶 ชีวิตรอบตัว: ชาวบ้านเดินผ่านในหมู่บ้านและตลาด ไก่จิกดินในนา','🥋 ท่าทางตามสิ่งที่ทำ: ฝึกยุทธ์มีวงกระบี่ · ลมปราณหมุนรอบตัว · ศึกษามีตัวอักษรลอย · ทำงานเหงื่อออก · ท่องยุทธภพฝุ่นตลบ · พักผ่อน Zzz · ครอบครัวหัวใจลอย · งานช่างประกายไฟ','✨ อนิเมชันตามเหตุการณ์: แต่งงานหัวใจลอย · ได้เงินเหรียญกระเด็น · ทะลวงขั้นเสาแสง · ชนะศึกรอยฟัน · บาดเจ็บจอแดงสั่น · ป่วยไอพิษ · ได้วิชาม้วนคัมภีร์ · สัตว์อสูรโผล่ในฉากจริง']},
 {v:'5.1',d:'7 พ.ย. 2026',l:['🏞️ เพิ่มเพลงพื้นหลัง mists — เลือกได้ในเมนู 🔊 เสียง ว่าจะใช้เพลงบรรเลงในเกมหรือ mists']},
 {v:'5.0',d:'7 พ.ย. 2026',l:['🐉 สัตว์อสูร/สัตว์วิญญาณ 1,000 ตัว สุ่มชื่อ พันธุ์ ธาตุ นิสัย ถิ่นอาศัย และรูปร่างพิกเซล 10 ขั้น · เจอระหว่างท่องยุทธภพ เลือกสู้ สยบ สังเกต หรือหนี · ได้หนังเกล็ด แก่นอสูร ไปใช้งานช่าง','📖 สมุดสัตว์สะสมข้ามชีวิต','🐾 สัตว์คู่ใจ เลเวลขึ้น วิวัฒนาการ 2 ขั้น บางตัวแปลงกายเป็นมนุษย์ได้','🐾 โหมดใหม่ เกิดเป็นสัตว์: ลูกสัตว์ → อสูรพันปี แล้วเลือกแปลงกายเป็นคนหรือครองป่า','🌊 คลื่นสัตว์อสูรบุกเมือง','✨ เหตุการณ์ที่เคยเจอในชีวิตก่อนจะออกยากขึ้น เรื่องใหม่มีป้าย ✨','📜 เรื่องยาวหลายตอน 8 เรื่อง: คดีเด็กหาย รักต้องห้าม คัมภีร์ต้องสาป พี่น้องร่วมสาบาน หนี้ของบิดา ถูกใส่ร้ายในสำนัก มรดกที่หายไป ภูตจิ้งจอก','🤝 เหตุการณ์จากคนที่รู้จักจริง: เพื่อน พี่น้อง พ่อแม่ อาจารย์ คู่ชีวิต ลูก','💗 นิสัยโตตามการเลือก: ใจดี เหี้ยมโหด เจ้าเล่ห์ รักสงบ กล้าหาญ — ปลดล็อกเหตุการณ์เฉพาะ','🏜️ เหตุการณ์เฉพาะแต่ละดินแดน','🎒 ตัวเลือกช่วงวัยใหม่ 44 เรื่อง และทางแยกทุก 10 ปีไม่ซ้ำกัน','🕊️ ยุคสมัยผลัดเปลี่ยน: สันติสุข สงคราม โรคระบาด ยุคทอง ทุพภิกขภัย มารครองแผ่นดิน','🏯 การเมืองระหว่างสำนัก สงคราม พันธมิตร ผู้อาวุโสทรยศ ข้อเสนอให้หักหลัง','🥀 ครอบครัวสมจริงขึ้น: พ่อแม่มีนิสัยต่างกัน บางคนเย็นชา ลำเอียง ใจร้าย หรือขายลูก · พี่น้องหักหลังแย่งมรดก · ลูกทรยศพ่อแม่ยามแก่ · คุณเองก็เลือกเลี้ยงลูกแบบไหนก็ได้']},
 {v:'4.8',d:'7 พ.ย. 2026',l:['🏆 ทำเนียบ: แตะชื่อเพื่อดูชีวิตของคนนั้นได้ — สรุป ค่าพลัง ครอบครัว ไทม์ไลน์ทั้งชีวิต ของ วิชา ความสำเร็จ และคำอำลา','🔒 หน้าสรุปชีวิตเลือกได้ว่าจะ 🌐 เปิดให้คนอื่นดู หรือ 🔒 ตั้งเป็นส่วนตัว (เห็นแค่ชื่อกับคะแนน) เปลี่ยนได้ตลอด']},
 {v:'4.7',d:'7 พ.ย. 2026',l:['☁️ เซฟขึ้นเซิร์ฟเวอร์อัตโนมัติทุก 1–2 นาทีขณะเล่น ไม่ต้องกดเอง · ได้รหัสประจำเครื่องไว้โหลดเซฟล่าสุดในเครื่องอื่น','⏸ มีเรื่องให้ตัดสินใจ เวลาจะหยุดรอจนกว่าจะเลือก','⏩ เวลาเดินต่อเนื่อง ไม่ค้างรอข้อความ — ข้อความที่ค้างเยอะจะขึ้นเร็วขึ้นเอง','🩺 โรคเล็กน้อย (ไข้หวัด ไข้ป่า หัด) แทบไม่ตาย ยกเว้นตอนร่างกายทรุดหนัก · โรคเรื้อรังกัดกินช้าลงและไม่ทำให้ตายก่อนวัยชรา · เด็กเล็กรอดจากอุบัติเหตุได้บ่อยขึ้น','👁 ดูคนอื่นเล่นแบบสด: เห็นค่าพลัง ของ วิชา เควส ผู้คน และบันทึกชีวิต ดูได้อย่างเดียว · ผู้เล่นเลือกอนุญาตหรือปฏิเสธได้ · มีตัวเลขบอกว่ามีคนดูอยู่กี่คน']},
 {v:'4.6',d:'7 พ.ย. 2026',l:['🛠️ แก้บั๊กกด "อำลา" แล้วไม่เข้าหน้าสรุปชีวิต','🏮 ภาพย้อนความทรงจำก่อนหน้าสรุป: อายุนับขึ้นจาก 0 พร้อมเหตุการณ์สำคัญผุดขึ้นทีละเรื่อง โคมลอยขึ้นฟ้า แล้วปิดด้วยฉายาตัวทอง · แตะข้ามได้','✨ หน้าสรุปค่อยๆ เลื่อนขึ้นมาทีละส่วน และคะแนนตำนานนับขึ้น']},
 {v:'4.5',d:'7 พ.ย. 2026',l:['🐞 กระดานแจ้งบั๊กในเกม: แจ้งบั๊กหรือขอฟีเจอร์ แล้วทุกคนเห็นบนกระดาน กด 🙋 เจอเหมือนกัน / 👍 อยากได้เหมือนกัน · ผู้พัฒนาติด ✅ แก้แล้ว ได้','💬 ความคิดเห็นผู้เล่น: ให้ดาว 1–5 พร้อมเขียนว่าเกมเป็นยังไง เห็นคะแนนเฉลี่ยและความเห็นของทุกคน','⚑ รายงานข้อความที่ไม่เหมาะสมได้ทั้งสองกระดาน']},
 {v:'4.4',d:'7 พ.ย. 2026',l:['🏮 เปลี่ยนชื่อเป็น 1 ใน นวนิยาย ตัวอักษรโบราณสีทองอมน้ำตาล','🌲 หน้าแรกมีฉากหลังพิกเซล: ป่ามูริมยามสนธยา ภูเขา เจดีย์ โคมไฟ ใบไม้ร่วง หิ่งห้อย · เลือกโลกเทพเซียนแล้วเปลี่ยนเป็นเกาะลอย สำนักบนฟ้า ทะเลเมฆ กระบี่ลอย นกกระเรียน','🌍 โลกพิกเซล 32×32 วาดใหม่ มีทวีปจริง ทะเลทราย น้ำแข็งขั้วโลก เมฆ แสงเงา หมุนรอบตัว','☰ ปุ่มต่างๆ หน้าแรกย่อรวมไว้ในขีดสามขีดมุมขวาบน · เอาตัวนับผู้คนออก','🎵 เพลงใหม่แนวจีนบรรเลง: กู่เจิงไล่โน้ต ขลุ่ยถามตอบ เบสนุ่ม มีเสียงก้อง จังหวะช้าสบาย']},
 {v:'4.3',d:'7 พ.ย. 2026',l:['🔨 งานช่าง 4 สาย: ปรุงยา ตีเหล็ก ค่ายกล เขียนยันต์ — 20 ตำรับ เครื่องมือ 4 ขั้นมีความทนทาน ฝีมือขึ้นตามการลงมือ ผลงาน 4 ขั้น ตั้งงานประจำได้ และจุดมุ่งหมายใหม่ 🔨 งานช่าง','👥 หน้าผู้คน: ครอบครัว อาจารย์ เพื่อน ศัตรู พร้อมตัวกรอง ★ คนโปรด ค่าความสนิท ใช้เวลาด้วยกัน และชวนเป็นคู่หูได้ 3 คน','🏘️ เมือง: ร้านยา โรงตีเหล็ก ร้านพู่กัน ร้านหยก โรงเตี๊ยม และกระดานภารกิจเมืองที่มาใหม่ทุกปี','🏡 ตระกูล: จ้างคนรับใช้และพ่อบ้าน · พงศาวดารทุกรุ่น','🏰 ดันเจี้ยน 7 แห่ง เดินทีละห้อง 5 ห้องแล้วบอส ถอยออกได้ ได้วัตถุดิบ อุปกรณ์ ตำรับ','⚙️ หน้าอัตโนมัติ: ดูแลผู้คน ซื้อยา ขายวัตถุดิบเกิน ลงดันเจี้ยนเอง','🌧️ เสียงบรรยากาศ ฝน ลม น้ำตก นก แมลง ตามฉากและอากาศ · ปรับความดังเพลง/เสียงประกอบ/บรรยากาศแยกกัน · ฉากมีฝนและหิมะตก','📘 คู่มือในเกมและหน้าเว็บ · 🐞 แจ้งบั๊กไปที่ GitHub · 💾 ย้ายเซฟข้ามเครื่องด้วยรหัส','🌐 ออนไลน์ (บนเว็บ Vercel): แชทโลก แชร์ชีวิต ทำเนียบประจำสัปดาห์ ประลองเงา ฝากเซฟด้วยรหัสสั้น — เปิดใช้เมื่อเชื่อมฐานข้อมูลแล้ว']},
 {v:'4.2',d:'7 พ.ย. 2026',l:['📜 ตัวเลือกกด "▾ ย่อไว้ก่อน" ได้ — เวลายังเดินต่อ ถ้าจบปีก่อนจะให้ชะตาเลือกแทน · ตั้งให้ชะตาตัดสินอัตโนมัติ 5/10/20 วินาที · ตั้งให้ตัวเลือกขึ้นแบบย่อตลอดได้','🗓️ หลอดเวลาแบ่ง 12 เดือน · ฉากบอกเดือน ฤดู และสิ่งที่ตัวละครกำลังทำ · มีสรุปปีว่าทำอะไรและได้อะไรบ้าง','✍️ สร้างตัวละครเองด้วยแต้ม 15 แต้ม: เพศ ทรงผม สีผม สีผิว สีชุด ยุค ชาติกำเนิด กระดูก วิญญาณ การ์ดพรสวรรค์ (ด้านร้ายได้แต้มคืน) ปณิธาน และชื่อ · หรือออกแบบแค่หน้าตาแล้วสุ่มที่เหลือ','⚔️ ชุดสวมใส่: เครื่องประดับ 2 ช่อง ของวิเศษป้องกันตัว (บางชิ้นกันตายได้) และชุดแต่งกายที่เปลี่ยนสีชุดในฉาก · หาได้จากการท่องยุทธภพหรือซื้อที่ตลาด · สวมของดีกว่าให้อัตโนมัติ','📋 บันทึกเควส: รวมปณิธาน เควสระบบ ถุงมิติ แค้น โครงการ คู่แค้น ไว้ที่เดียว · ปักหมุดติดตามไว้เหนือบันทึกชีวิต · พักเควสระบบไว้ได้ (เวลาหยุด ไม่ล้มเหลว)']},
 {v:'4.1',d:'7 พ.ย. 2026',l:['🎨 ฉากพิกเซลละเอียดขึ้น 3 เท่า ตัวละครวาดใหม่ทั้งหมด: หน้าตาชัด มีตา คิ้ว ปาก กะพริบตา · ผมยาวสำหรับหญิง มวยผมสำหรับชาย · ชุดฮั่นฝูคอไขว้ มีเงาและแสง · แขนเสื้อ มือ เข็มขัดมีชายห้อย','😊 สีหน้าเปลี่ยนตามชีวิต: มีความสุขยิ้มแก้มแดง · เศร้าคิ้วตก น้ำตาไหล · บาดเจ็บหนักมีแผล','🧓 วัยต่างกันชัดเจน: เด็กตัวเล็กผมจุก · คนแก่ผมขาว มีริ้วรอย เคราสำหรับผู้ชาย','🌀 อนิเมชันลื่นขึ้น ~30 เฟรมต่อวินาที: หายใจขึ้นลง แขนแกว่งตอนเดิน ชายเสื้อพลิ้วลม ผ้าคาดหัวโบก ออร่าเต้นเป็นจังหวะพร้อมประกายลอยขึ้น','🌦️ บรรยากาศ: กลีบดอกไม้ ใบไม้ หิมะเคลื่อนนุ่มนวล · ปีที่เศร้าภาพโทนฟ้าหม่น ปีที่มีความสุขโทนอุ่น · บาดเจ็บหนักขอบจอแดงกะพริบ · ลำแสงบนยอดเขา · ฝุ่นละอองในบ้าน · ขอบภาพมืดลงเล็กน้อยให้มีมิติ']},
 {v:'4.0',d:'7 พ.ย. 2026',l:['😈 ศัตรูคู่แค้นตลอดชีวิต: ปะทะกันทุกไม่กี่ปี ฉายาเปลี่ยนตามความแค้น (ศัตรูวัยเยาว์ → มารร้ายแห่งยุค) เลือกสู้ เจรจา หรือหลบ จนถึงศึกตัดสินบนยอดเขา','🗺️ แผนที่ยุทธภพ/โลกเซียน: บ้านเกิด · เมืองหลวง · สำนัก · ดินแดนที่เคยไป · มิติลับ · ถ้ำ · กิจการ · ศัตรู (ในเมนู)','⚔️ ดวลด้วยวิชาจริง: วิชาที่เรียนมามี 4 สาย 💥 ทำลายล้าง · 🛡️ คุ้มกาย · ☠️ พิษ · 💚 ฟื้นฟู และใช้ยาสมานแผลหรือยันต์จากกระเป๋ากลางศึกได้','👻 เล่นต่อเป็นคนอื่น: ตอนจบชีวิต เลือกเล่นต่อเป็นคนที่เกิดพร้อมกันหรือศิษย์คนแรกได้','💾 เซฟได้ 3 ช่อง เล่นค้างหลายชีวิตพร้อมกัน','🎖️ ธีมพิเศษปลดล็อกจากความสำเร็จ: 🍃 หยกเขียว · 🩸 โลหิตมาร · ✨ ทองเซียน','🪔 เทศกาลตามวันจริง: ตรุษจีน · โคมไฟ · เชงเม้ง · เรือมังกร · ชีซี · ไหว้พระจันทร์ · โคมลอย · ตงจื้อ มีอีเวนต์และโคมลอยในฉาก','🔠 ปรับขนาดตัวอักษร เล็ก · กลาง · ใหญ่','❓ แนะนำการเล่นครั้งแรก ชี้ทีละปุ่ม เปิดดูซ้ำได้ในเมนู']},
 {v:'3.9',d:'7 พ.ย. 2026',l:['⏭ ปุ่มข้ามข้อความ หรือแตะที่ฟีด — ข้อความที่เหลือของปีขึ้นทันที','📜 บันทึกชีวิตกลางเกม: ดูเหตุการณ์สำคัญย้อนหลังได้ทุกเมื่อ กรองดูเฉพาะ รัก · ศึก · พลัง · ระบบ · สำนัก','📳 มือถือสั่นเบาๆ ตอนเกิดเหตุการณ์ระดับตำนาน','📅 ชะตาประจำวัน: ทุกวันทุกคนได้ชาติกำเนิดเดียวกัน (แยกยุทธภพ/โลกเซียน) เก็บคะแนนดีที่สุดของวัน','🔥 โหมดท้าทาย: นรก (ห้ามสุ่มใหม่ โรคแรงขึ้น ศัตรูเก่งขึ้น) · ชีวิตสั้น 30 ปี · รากขยะ (พรสวรรค์ต่ำสุดเสมอ)','🖼️ อัลบั้มความทรงจำ: เก็บภาพฉากพิกเซลเองตอน แต่งงาน · ทะลวงขั้น · เหตุการณ์ระดับตำนาน ดูได้ในบันทึกชีวิตและหน้าสรุป','🖼️ การ์ดชีวิตเป็นรูป: ภาพตัวละคร ฉายา ระดับ อายุ บันทึกหรือส่งต่อได้','🪦 สุสานบรรพชน: รวมทุกชีวิตพร้อมคำไว้อาลัย และต้นไม้ตระกูลเมื่อสืบทอดเป็นลูกหลาน','📚 สารานุกรม: ระดับพลัง 3 โลก · สำนัก · ตระกูล · ระบบ · โลกเดิม · ไอเท็ม · โรค · ดินแดน · อาชีพ ปลดล็อกเมื่อเจอครั้งแรก','📊 สถิติรวม: อายุเฉลี่ย · สาเหตุการตาย · ระดับพลัง · ระบบที่เคยได้ · โลกที่เกิด','🏅 ความสำเร็จใหม่ 4 อย่าง']},
 {v:'3.8',d:'7 พ.ย. 2026',l:['⏳ ข้อความค่อยๆ ขึ้นทีละบรรทัดพร้อมเอฟเฟกต์เลื่อนขึ้น แทนการโผล่มาพร้อมกันทีเดียว — ลุ้นได้ว่าปีนี้จะเกิดอะไรต่อ','ความเร็วการขึ้นข้อความปรับตามความเร็วเกม (1× ช้า ลุ้นได้ · 16× เร็ว)','ปีถัดไปจะเริ่มเมื่อข้อความของปีนี้ขึ้นครบแล้ว','หน้าต่างตัวเลือกจะเด้งหลังข้อความก่อนหน้าขึ้นครบ จะได้รู้ว่าเกิดอะไรขึ้นก่อนต้องตัดสินใจ','🧹 โลกเซียน: ตรวจละเอียดทุกจุดแล้ว — ชื่อพรสวรรค์ (กระดูกดี → รากวิญญาณสองธาตุ) · หน้าสถานะ · แถบด้านบน · หน้าครอบครัว · คนเกิดพร้อมคุณ · หน้าเกิด · หน้าสรุปตอนตาย · ข้อความแชร์ · ทางราชการ (ราชครูเซียน · ศึกกำแพงเผ่าอสูร) · หน้าแรกเปลี่ยนคำตามโลกที่เลือก']},
 {v:'3.7',d:'7 พ.ย. 2026',l:['📆 แต่ละปีมีหลายเหตุการณ์: นอกจากข้อความประจำปี จะมีเรื่องเล็กๆ ในชีวิต 1–3 เรื่อง เรื่องประจำวัน และโอกาสเจออีเวนต์ใหญ่สูงขึ้น (40% → 50%)','👶 เรื่องเล็กๆ ตามวัย: ทารก (ยิ้มครั้งแรก · พูดคำแรก) · เด็ก (หลงในตลาด · วาดรูปบนกำแพง) · วัยรุ่น · ผู้ใหญ่ · คนแก่ (ลืมว่าวางกระบี่ไว้ไหน · รายชื่อเพื่อนที่ยังมีชีวิตสั้นลงทุกปี)','👪 คนรอบตัวมีเรื่องทุกปี: พ่อแม่ · พี่น้อง · คู่ชีวิต · ลูก · อาจารย์ · ศิษย์ร่วมสำนัก · คนที่เกิดพร้อมคุณ','☁️ ทั้งโลกยุทธภพและโลกเทพเซียนมีชุดเรื่องเล็กๆ ของตัวเอง ไม่ซ้ำกันใน 40 เรื่องล่าสุด']},
 {v:'3.6',d:'7 พ.ย. 2026',l:['🧹 ล้างคำของยุทธภพออกจากโลกเซียน: จอมยุทธ์ → ผู้ฝึกตน · ตำลึง → หินวิญญาณ · ฮ่องเต้ → จักรพรรดิเซียน · พรรค → นิกาย · โจรภูเขา → ผู้ฝึกตนนอกรีต · ระดับขั้นสาม/ขั้นสองในตัวเลือกเปลี่ยนเป็นระดับเซียน ฯลฯ ทั้งในข้อความ ตัวเลือก และหน้าต่างทุกอัน','🎯 ปุ่มโฟกัสเปลี่ยนชื่อตามโลก: ฝึกวิชาเซียน · บ่มเพาะปราณ · ท่องโลกเซียน · งานนิกาย · หาหินวิญญาณ','📝 ข้อความประจำปีแบบเซียน: ฝึกกระบี่บิน · กลืนหินวิญญาณ · หลอมแก่นปราณ · รับภารกิจจากหอภารกิจ · ล่องทะเลเมฆ · สถานที่ใหม่ เช่น เกาะลอยฟ้า ถ้ำบ่มเพาะ ต้นท้อเซียน','☁️ เรื่องเล็กๆ ประจำวัน ข่าวลือ และข้อความหายากแบบเซียน','🔮 อีเวนต์เซียนใหม่: พิธีทดสอบรากวิญญาณ · เห็นคนฝ่าทัณฑ์ · หอภารกิจ · ถ้ำของผู้อาวุโสที่ล่วงลับ · ศึกระหว่างนิกาย · กลับไปเยี่ยมโลกมนุษย์ · ถูกตามล่าเพราะสมบัติ']},
 {v:'3.5',d:'7 พ.ย. 2026',l:['🌌 ผู้ข้ามมิติในโลกเซียนพบบ่อยขึ้นมาก และมีแบบใหม่: จอมยุทธ์จากยุทธภพ · จักรพรรดิเซียนเมื่อหมื่นปีก่อนที่เกิดใหม่ (ความทรงจำกลับมาทุก 15 ปี) · ผู้ย้อนเวลา (รู้ล่วงหน้า ป่วยยาก ได้เปรียบ)','📱 ของติดตัวแบบเซียน: มือถือที่กลายเป็นของวิเศษ · ตำราคณิตศาสตร์ (ปลดล็อกปรมาจารย์ค่ายกล) · ปืนเติมพลังด้วยหินวิญญาณ · แหวนวิญญาณผู้เฒ่า','🎒 กระเป๋าทุกโหมด: ขนาดตามชาติกำเนิด (ห่อผ้า 3 ช่อง ถึงหีบตระกูล 14 ช่อง) อาจถูกปล้น · ของใช้อัตโนมัติ: ยาสมานแผล · ยารักษาโรค · ยาทะลวงขั้น · ยันต์คุ้มกาย · ผลไม้อายุวัฒนะ · แผนที่มิติลับ · ไข่สัตว์วิญญาณ','🟦 ถุงมิติต้องทำเควสพิเศษของระบบก่อน ได้แล้ว 30 ช่องไม่มีวันถูกขโมย อัปเกรดเป็นแหวนมิติ 60 ช่อง และโลกในแหวน 120 ช่อง','💎 โลกเซียนใช้หินวิญญาณแทนเงิน (ขั้นต่ำ · กลาง · สูง · ชั้นยอด)','🔨 งานประมูล: สู้ราคากับคู่แข่ง ชนะแล้วอาจถูกดักปล้น','🌱 รากวิญญาณ: ห้าธาตุปน (ขยะ) · สามธาตุ · สองธาตุ · ธาตุเดียวบริสุทธิ์ · ธาตุพิเศษ — รากขยะที่มีระบบจะถูกหลอมใหม่','☯️ กฎแห่งเต๋า 7 สาย ต้องหยั่งรู้ให้พอ ไม่อย่างนั้นติดคอขวดตั้งแต่ก่อกำเนิดวิญญาณขึ้นไป','🏔️ ถ้ำบ่มเพาะส่วนตัว อัปเกรดได้ 5 ขั้น จนเป็นตำหนักเซียนลอยฟ้า','🧘 ปิดด่านข้ามเวลา 10 · 50 · 100 ปีในครั้งเดียว ออกมาแล้วโลกเปลี่ยน (กดได้ในหน้ากระเป๋า)','🛠️ อาชีพเซียน: นักหลอมโอสถ · ช่างหลอมอาวุธ · ปรมาจารย์ค่ายกล · นักวาดยันต์ มี 5 ระดับ','🌟 สามชั้นโลก: ยุทธภพ → โลกเซียน → โลกเทพ ตอนจบสูงสุดคือเทพสูงสุด','อีเวนต์เซียนเพิ่ม: ตบหน้าคุณชายเย่อหยิ่ง (แล้วเขากลับมา) · ศึกมนุษย์กับเผ่าอสูร · มรดกเมืองเซียนโบราณ · ถูกใส่ร้ายว่าเป็นมาร','🐉 สัตว์พันธสัญญาวิวัฒนาการได้ 5 ขั้นจนเป็นสัตว์เทพ ช่วยต่อสู้ และไม่ตายเพราะอายุ','🎨 ฉากโลกเซียน: เกาะลอยฟ้า ศาลาบนเกาะ นกกระเรียน ท้องฟ้าโทนม่วง (โลกเทพเป็นโทนทอง)','🏅 ความสำเร็จใหม่ 9 อย่าง']},
 {v:'3.4',d:'7 พ.ย. 2026',l:['☁️ โหมดใหม่: โลกเทพเซียน — เลือกได้ที่หน้าแรก','ระดับพลังแบบเซียน: ฝึกปราณ → สร้างรากฐาน → แก่นทอง → ก่อกำเนิดวิญญาณ → แปรวิญญาณ → มหายาน → ข้ามทัณฑ์ อายุยืนได้หลายร้อยปี','สำนักทั้งหมดกลายเป็นสำนักเซียน (เช่น สำนักกระบี่ภูผาเซียน · หอโอสถอมตะ · วังมารสวรรค์) พร้อมตำแหน่งแบบโลกเซียน','🟦 ระบบปรากฏบ่อยขึ้น 3 เท่า เควสมากขึ้น (ถือได้ 3 เควส) และเควสเหตุการณ์ถี่ขึ้น','อีเวนต์เฉพาะโลกเซียน: สมบัติวิญญาณ · หลอมโอสถ · สัตว์วิญญาณ · อาวุธวิเศษเลือกนาย · ประลองชิงอันดับสำนัก · ผู้ฝึกตนสายมาร · จิตแห่งเต๋า · คู่บ่มเพาะ','⚡ ทะลวงขั้นสูงต้องรับทัณฑ์สายฟ้า','🌈 เล่นยุทธภพจนถึงแซงซากยอง ฝ่าทัณฑ์สวรรค์สำเร็จจะเหาะขึ้นสู่โลกเทพเซียนแล้วเล่นต่อ เริ่มใหม่จากขั้นฝึกปราณ','🏆 ตอนจบสูงสุดในโลกเซียน: บรรลุเป็นเซียนอมตะ · ความสำเร็จใหม่ 6 อย่าง']},
 {v:'3.3',d:'7 พ.ย. 2026',l:['📝 ข้อความประจำปีสร้างจากชิ้นส่วน: สถานที่ × การกระทำ × อารมณ์ × ฤดู ได้หลายหมื่นแบบ','🏯 ใส่ชื่อจริงจากชีวิตนั้น: วิชาที่เรียน · อาวุธที่ถือ · คู่ชีวิต · ลูก · สถานที่ของสำนักคุณ (วัดศิลาธรรมฝึกท่ามกลางเสียงสวด · ลัทธิมารฝึกในถ้ำเลือด ฯลฯ)','🌸 ทุกปีมีฤดูกาลและอากาศของตัวเอง','⚡ ข้อความเปลี่ยนตามระดับพลัง: ขั้นต่ำฝึกจนมือพอง · ระดับสูงฟาดทีเดียวภูเขามีรอยแยก · วัยชราฝึกช้าแต่แม่นยำ','💭 อารมณ์มีผล: ปีที่เศร้า ข้อความจะหม่น ปีที่มีความสุข ข้อความจะสดใส','🗣️ คนรอบตัวพูดแทรก: อาจารย์ · คู่ชีวิต · ลูก · คู่ปรับ','🕰️ นึกถึงเรื่องในอดีต: ข้อความประจำปีหยิบเหตุการณ์สำคัญเมื่อหลายปีก่อนมาเอ่ยถึง','📰 ข่าวลือยุทธภพ: ทำเนียบสำนัก · ชีวิตของคนที่เกิดพร้อมคุณ · เรื่องแปลกทั่วแผ่นดิน','✨ ข้อความหายาก (ราว 1%) เช่น นั่งสมาธิจนนกมาทำรังบนหัว','📖 ช่วงฝึกต่อเนื่องหลายปีมีประโยคสรุปเล่าเรื่องแทนตัวเลขเปล่าๆ']},
 {v:'3.2',d:'7 พ.ย. 2026',l:['🧩 ปมปริศนาชาติกำเนิด (ราว 1 ใน 5 ชีวิต): ทายาทตระกูลที่ถูกล้างบาง · สายเลือดมารที่ถูกซ่อน · ทารกถูกสลับตัว · ผนึกในร่างกาย — เบาะแส 3 ชิ้นก่อนเผยความจริง','🌀 มิติลับเปิดทุก 10 ปี: ลงทีละชั้น 5 ชั้น เลือกลงต่อหรือถอยพร้อมของ ยิ่งลึกยิ่งได้ของดี ยิ่งเสี่ยงตาย','🏜️ ดินแดนต่างถิ่น 4 แห่ง: ทะเลทรายตะวันตก · ทะเลใต้ · ดินแดนหิมะเหนือ · แดนเถื่อนใต้ มีอีเวนต์และวิชาเฉพาะถิ่น','💔 รักมีปม: คู่ชีวิตเป็นสายลับ · รักสามเส้า · คู่ปรับกลายเป็นคนรัก · คนรักเก่ากลับมา','🔥 สงครามใหญ่: กบฏโค่นราชวงศ์ · ศึกพันธมิตรสามก๊ก เลือกข้าง เป็นสายลับสองหน้า หรือนำทัพในศึกสุดท้าย','🦊 เหนือธรรมชาติ: จิ้งจอกเก้าหาง · หมู่บ้านไร้เงา · ป้อมจันทร์เลือด · กระบี่ผีสิง','🎲 มินิเกม: แข่งดื่มสุรา 5 ไห · บ่อนลูกเต๋า · หมากล้อมทายทาง · ประชันบทกวี','🏪 อาชีพเสริม: โรงเตี๊ยม · ร้านตีเหล็ก · ร้านยา ขยายได้ 5 ระดับ','👥 คนที่เกิดวินาทีเดียวกันมีชีวิตของตัวเอง: ขึ้นเป็นผู้นำ · เป็นมารสวรรค์ · ตายในศึก · ส่งแม่สื่อมาสู่ขอลูกคุณ','⚖️ ปัญหาที่ไม่มีคำตอบถูก 6 แบบ เช่น เรือกำลังล่ม · ยาเม็ดเดียว · ลูกของศัตรู','⚡ ตอนจบพิเศษ: แซงซากยองฝ่าทัณฑ์สวรรค์ 3 ระลอกเพื่อเหาะเป็นเซียน','🧬 สืบทอดข้ามชาติ: ชีวิตใหม่อาจพบตำรา หลุมศพ หรือความทรงจำจากชีวิตก่อนหน้า','🏅 ความสำเร็จใหม่ 12 อย่าง']},
 {v:'3.1',d:'7 พ.ย. 2026',l:['🔁 อีเวนต์ซ้ำน้อยลงมาก: อีเวนต์พิเศษเกิดได้ครั้งเดียวต่อชีวิต (ขอทานลึกลับ · ลักพาตัว ฯลฯ) และทุกอีเวนต์มีช่วงพัก ไม่เด้งซ้ำภายในหลายปี','🧒👨👴 อีเวนต์ใหม่ราว 35 แบบตามวัย: เด็ก (ช่วยเด็กจมน้ำ · แอบดูสำนัก · ลูกเจ้าที่ดินเกเร) · หนุ่มสาว (หอคัมภีร์ต้องห้าม · ถูกใส่ร้าย · งานโคมไฟ) · กลางคน (ศิษย์คนแรก · คอขวดวิถียุทธ์ · การเมืองในสำนัก) · ชรา (เขียนตำรา · ศัตรูเก่ามาจิบชา · คนหนุ่มมาท้า)','🌑 ยอดฝีมือระดับขั้นสุดยอดขึ้นไปไม่เจอโจรกระจอกแล้ว เจอยอดฝีมือท้าทาย สัตว์เทพ มารในใจ ราชสำนักเชิญเป็นราชครูแทน','📋 สอบเลื่อนขั้น 5 รูปแบบ: ประลอง · ข้อเขียน · ภารกิจจริง · ค่ายกล · ล่าสัตว์อสูร','🗡️ งานสังหาร: เป้าหมาย 12 แบบ เลือกวางยาพิษ หรือสืบผู้ว่าจ้างก่อนได้ (อาจเป็นกับดัก) · โจรดักปล้นมี 5 แบบ','🔁 ผลกรรมย้อนกลับแบบใหม่: เด็กที่เคยช่วยกลับมาตอบแทน · บัณฑิตปากร้ายกลับมาขอโทษหรือแก้แค้น · พ่อค้าที่ให้ยืมเงินกลับมาเป็นเจ้าสัว · ศิษย์คนแรกโด่งดังหรือทรยศ','👴 ผู้อาวุโสสอนวิชาสูงสุด 4 ครั้งและมีบทพูดหลากหลาย · ทำเนียบสำนักแจ้งเฉพาะเรื่องที่เกี่ยวกับคุณ','📝 ประโยคประจำปีกับเรื่องชีวิตประจำวันเพิ่มขึ้นราว 2 เท่า']},
 {v:'3.0',d:'7 พ.ย. 2026',l:['🟦 ระบบใหม่ 5 ประเภท (รวมเป็น 10): 🌠 ก้าวข้ามขีดจำกัด · 🎰 สุ่มกาชาสวรรค์ · 😈 ตัวร้ายผู้ชิงชะตา · ⚗️ เซียนโอสถ · 💍 วิญญาณผู้เฒ่าในแหวน','⭐ ระบบมีระดับ: สามัญ · ทองคำ (รางวัล ×1.25) · ศักดิ์สิทธิ์ (×1.5) และวิวัฒนาการที่ Lv.10 / Lv.20','📜 เควสหลักของแต่ละระบบ 3 บท ไม่จำกัดเวลา จบแล้วได้รางวัลใหญ่','🔓 เควสลับ 8 แบบ ซ่อนเงื่อนไขไว้ ปลดล็อกเมื่อทำได้','🎲 เควสเหตุการณ์ใหม่ 14 แบบ เช่น ตบหน้าคุณชายเย่อหยิ่ง · ปริศนาถ้ำโบราณ · แกล้งแพ้ให้เด็ก · งานประมูลใต้ดิน · ประลองกับผู้แข็งแกร่งกว่า','🧭 บางครั้งระบบให้เลือกเควสเองจาก 3 ทาง · เควสรองแบบใหม่: อัปเกรดอาวุธ · ย้ายบ้าน · ปัญญา · เสน่ห์ · หลอมยา','⚡ บทลงโทษเควสหลากหลายขึ้น: ไฟช็อต · ยึด SP · ผนึกพลัง · ลบ EXP','🛒 ร้านค้าระบบมีของเฉพาะประเภท','🏅 ความสำเร็จใหม่ 9 อย่าง']},
 {v:'2.9',d:'7 พ.ย. 2026',l:['🩸 ชาติกำเนิดใหม่ (หายากมาก ราว 1 ใน 300 ต่อฝ่าย): บุตรแห่งมารสวรรค์ · ทายาทเจ้าสำนักธรรมะ · ทายาทประมุขพรรคอธรรม — อยู่ในสำนักตั้งแต่เกิด มีพี่น้องต่างมารดา 2 คนเป็นคู่แข่ง','📕 คัมภีร์ประจำสำนักปลดล็อกทีละบท 5 บท ตามอายุและพลัง (บทสุดท้ายระดับเทพ)','👑 บททดสอบผู้สืบทอดตอนอายุ 16 · 21 · 26 แตกต่างกันตามฝ่าย จบด้วยศึกชิงบัลลังก์ — ชนะได้เป็นมารสวรรค์รุ่นที่ X / เจ้าสำนักรุ่นที่ X / ประมุขรุ่นที่ X','อายุ 14 เลือกได้ว่าจะเดินตามชะตา ทิ้งไปอยู่อีกฝ่าย หรือซ่อนตัวตน · ถูกลอบสังหารหรือตามล่าเป็นระยะ · ลูกของผู้สืบทอดเป็นทายาทรุ่นต่อไปได้','🎨 ภาพพิกเซลสะท้อนตัวตนชัดขึ้น: ชุดประจำแต่ละสำนัก 16 แบบ (หัวโล้นพระ หมวกนักพรต ปิ่นดอกท้อ หน้ากากนักฆ่า ผ้าคาดหัวโจรสลัด เขามาร ฯลฯ) · ชุดตามชาติกำเนิด ตระกูล ขุนนาง ฤๅษี นักฆ่า · มงกุฎเมื่อได้เป็นผู้นำ','อาวุธเห็นบนหลังตามระดับ (กระบี่หยกสีเขียว กระบี่เทพเรืองแสงทอง) · เกราะไหล่ · ม้าเดินข้างตัว · สัตว์เลี้ยงตามติด · ห้องในบ้านเปลี่ยนตามระดับบ้าน · ธงในห้องโถงเป็นสีของสำนัก','สมุดตำนานเพิ่ม 5 ความสำเร็จ']},
 {v:'2.8',d:'7 พ.ย. 2026',l:['✨ พรสวรรค์พิเศษตอนเกิด 0–3 อย่าง (แยกจากกระดูก) มีทั้งหมด 15 แบบ: บ่มเพาะลมปราณเร็ว · เรียนรู้วรยุทธเร็ว · กายาหยินหยางสมดุล · ปัญญาเลิศล้ำ · รูปงามล่มเมือง · กายาเหล็กไหล · กายาต้านพิษ · อายุยืน · ดวงดาวนำโชค · เนตรทิพย์ · ความจำภาพถ่าย · สายเลือดมังกร (หายากมาก)','⚠️ ด้านร้าย: ชีพจรตายด้าน (แทบเรียนวรยุทธไม่ได้ แต่มีโอกาส 45% ที่ระบบจะลงมาหาและซ่อมแซมชีพจรให้) · ร่างกายอ่อนแอ · ดาวอัปมงคล','ทายาทมีโอกาส 30% ได้พรสวรรค์ด้านดีจากพ่อแม่ · สมุดตำนานเพิ่ม 4 ความสำเร็จ']},
 {v:'2.7',d:'7 พ.ย. 2026',l:['🛡️ ยิ่งแกร่งยิ่งป่วยยาก: ระดับพลังลดโอกาสป่วยและโอกาสตายจากโรคแบบไล่ระดับ — ขั้นสาม −15% · ขั้นหนึ่ง −50% · ขั้นสุดยอด −70% · ฮวากยอง −85% · ฮยอนกยอง −95% · แซงซากยองไม่ป่วยอีกเลย','ลมปราณช่วยต้านโรคเพิ่ม (สูงสุดอีกครึ่งหนึ่ง) · ตั้งแต่ขั้นสุดยอดขึ้นไปร่างกายไม่ทรุดตามวัย · ฮวากยองขึ้นไปไม่เป็นโรคเรื้อรัง และขับโรคเรื้อรังออกได้ง่ายขึ้นตามระดับ','โรคระบาดแทบไม่ระคายยอดฝีมือ (ใช้กับคนที่เกิดพร้อมกันด้วย)']},
 {v:'2.6',d:'7 พ.ย. 2026',l:['🗓️ หน้าสรุปตอนตายมีไทม์ไลน์ทั้งชีวิต ตั้งแต่ลืมตาดูโลกจนวันที่จากไป แบ่งเป็นวัยเด็ก · วัยหนุ่มสาว · วัยกลางคน · วัยชรา กดพับหรือกางแต่ละช่วงได้','📈 กราฟชีวิต 2 เส้น: พลังรวม และความสุข ตลอดทุกปี แตะหรือลากบนกราฟเพื่อดูค่าแต่ละปี']},
 {v:'2.5',d:'6 พ.ย. 2026',l:['⏳ ยิ่งพลังสูง ยิ่งอายุยืน: โบนัสอายุขัยตามระดับ — ขั้นหนึ่ง +10 · ขั้นสุดยอด +20 · ฮวากยอง +40 · ฮยอนกยอง +70 · แซงซากยอง +100','แซงซากยอง (เหนือเกิดเหนือตาย) มีชีวิตได้ถึง 200 ปี ระดับอื่นยังสูงสุด 150 ปี','คนที่เกิดพร้อมกันใช้กฎเดียวกัน · สมุดตำนานเพิ่ม เหนือกาลเวลา (อายุ 180 ปี)']},
 {v:'2.4',d:'6 พ.ย. 2026',l:['🛒 ตลาดยุทธภพ (เมนู ☰): อาวุธ 4 ระดับ · ชุดเกราะ 3 ระดับ (เจ็บน้อยลง) · พาหนะ 3 แบบ (โชคดีตอนท่องยุทธภพ หนีเก่ง ทำงานได้เงินเพิ่ม) · บ้าน 3 ระดับ (ความสุข + รายได้) · ยาบำรุง · ยาลมปราณ · ลงทุนกองคาราวาน (เสี่ยงได้เสี่ยงเสีย) · บริจาค','อาวุธ ชุดเกราะ ม้า และบ้าน ส่งต่อเป็นมรดกให้ทายาท','📖 เหตุการณ์ชีวิตประจำวัน: เทศกาลจีน 6 เทศกาล · ฤดูกาล · สัตว์เลี้ยง (แมว หมา นกกระเรียน ลิง) · งานอดิเรก · ข่าวลือเรื่องคนที่เกิดพร้อมกัน · ความฝันของผู้ข้ามมิติ · วัยเด็ก · วัยชรา · ลูกตัวเล็ก','คำบรรยายงานประจำเพิ่มเป็น 7–12 แบบต่ออย่าง','⚖️ ปรับสมดุล: ระบบอ่อนลง (พลังรายปี โบนัสฝึก EXP ราคายาทะลวงขั้นและการ์ดคืนชีพ) · ทารกตายน้อยลง · พลังชีวิตสูงสุดเพิ่มตามวัย ฟื้นตัวเร็วขึ้น · มีโอกาสรอดตายหวุดหวิด (ทุก 8 ปี) · อายุยืนจากระดับพลังลดลง']},
 {v:'2.3',d:'6 พ.ย. 2026',l:['👪 ครอบครัวมีตัวตนจริง: พ่อแม่มีชื่อและนิสัย (ใจดี เข้มงวด ขี้เมา ฯลฯ) แก่ตัวลง ล้มป่วย และจากไป · มีพี่น้อง 0–3 คน ที่โต เข้าสำนัก แต่งงาน หรือตายได้','เหตุการณ์ครอบครัว: ดูแลพ่อแม่ยามป่วย · แบ่งมรดก · พี่น้องขอยืมเงิน · พี่น้องต่างอุดมการณ์ต้องเผชิญหน้ากัน · พี่น้องถูกจับเรียกค่าไถ่ · เด็กกำพร้าอาจได้พบพ่อแม่ที่แท้จริง','💍 คู่ครองมีนิสัยและค่าความรัก — ทิ้งไปท่องยุทธภพนานๆ ความรักลด อาจทะเลาะจนหย่า','👦 ลูกเป็นคนจริงๆ มีชื่อ พรสวรรค์ โตขึ้น สอบเข้าสำนัก แต่งงาน มีหลาน · ตอนจบเลือกได้ว่าจะให้ลูกคนไหนสืบทอด','😊 ค่าความสุข: ขึ้นกับครอบครัว เงิน สุขภาพ และความสูญเสีย · สุขมากฝึกได้ผลดีและอายุยืน · เศร้ามากฝึกได้ผลน้อยลงและอาจจมดิ่ง ต้องหาทางออก','เมนู 👪 ครอบครัว ดูทุกคนในบ้าน · สมุดตำนานเพิ่ม 4 ความสำเร็จ']},
 {v:'2.2',d:'6 พ.ย. 2026',l:['📋 สอบเลื่อนขั้นประจำปี: ผลงานถึงเกณฑ์แล้วต้องผ่านการสอบก่อน — ดวลกับศิษย์ร่วมสำนัก (อาจเป็นคนที่เกิดพร้อมกัน) · แสดงวิชาเดี่ยว · ขอให้อาจารย์รับรอง · ถวายของกำนัล (ฝ่ายอธรรม/มาร) หรือยอมแพ้ให้เพื่อน','👑 ตำแหน่งผู้นำสำนักต้องชิงในศึกชิงตำแหน่ง','📜 ทำเนียบสิบสำนักใหญ่: อันดับขยับทุกปีตามชื่อเสียงของผู้นำ สงครามระหว่างพรรค และเหตุการณ์ใหญ่ (ประมุขมารคืนชีพดันฝ่ายมารขึ้น ผนึกมารสำเร็จฝ่ายมารร่วง)','เป็นผู้นำแล้วดันสำนักขึ้นอันดับได้ สำนักที่ก่อตั้งเองก็ติดทำเนียบได้ · สามอันดับแรกได้ชื่อเสียงทุกปีแต่สอบเข้ายากขึ้น','สมุดตำนานเพิ่ม 2 ความสำเร็จ']},
 {v:'2.1',d:'6 พ.ย. 2026',l:['🏯 แบ่งสำนักใหญ่ (16) กับสำนักเล็ก (9) — สำนักเล็กรับง่ายแต่โบนัสน้อย ถ้าเก่งพอสำนักใหญ่จะมาทาบทามให้ย้าย','📝 สอบเข้าสำนักใหญ่ 3 ด่าน ต่างกันตามฝ่าย: ธรรมะ (ตรวจกระดูก · บันไดพันขั้น · คำถามคุณธรรม) · อธรรม (ขโมยป้ายหยก · ประลองคัดตัว · บททดสอบใจ) · มาร (ถ้วยยาพิษ · ถ้ำกลืนกิน · พิธีบูชายัญ) ต้องผ่าน 2 ด่าน — สอบตกยังไปสำนักเล็กได้','👥 คนที่เกิดพร้อมกันอาจมาสอบรุ่นเดียวกัน แข่งกัน ช่วยกัน หรือกลายเป็นคู่ปรับจากสนามสอบ','👴 ผู้อาวุโสเห็นแวว: สอบได้ดียิ่งมีผู้อาวุโสมาขอรับเป็นศิษย์หลายคน แต่ละคนมีสาย (กระบี่ ลมปราณ พิษ วิญญาณ ฯลฯ) ระดับพลังที่สูงกว่าคุณต่างกัน และนิสัย (เข้มงวด ใจดี ประหลาด เย็นชา)','อาจารย์สอนวิชาตามสายเป็นระยะ ถ้าพลังแซงอาจารย์ = ศิษย์เหนือครู และอาจได้จดหมายแนะนำไปหาผู้อาวุโสที่แกร่งกว่า','สมุดตำนานเพิ่ม 4 ความสำเร็จ']},

function drawAvatar(cv,seed,gender,demon){
 const c=cv.getContext('2d');if(!c)return;let s=seed;const rnd=()=>(s=(s*9301+49297)%233280)/233280;
 c.clearRect(0,0,16,16);const {skin,hair,robe}=avatarCols(seed,gender,demon);
 const P=(x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(x,y,w,h)};
 P(4,3,8,7,skin);P(3,2,10,3,hair);P(3,4,2,4,hair);P(11,4,2,4,hair);
 if(gender==='หญิง'){P(3,7,2,5,hair);P(11,7,2,5,hair)}else{P(7,0,2,2,hair)}
 P(6,6,1,1,'#2a2838');P(9,6,1,1,'#2a2838');P(7,8,2,1,'#c0525e');
 P(3,10,10,6,robe);P(7,10,2,6,'#ffffff88');P(5,10,6,1,'#2a283855');
}

 if(my>=en&&S.sys){gainExp(10);if(S.sys.t==='demon'){S.power+=20*S.sys.lv;S.karma-=1}}
 if(my<en){const sb=(S.sibs||[]).find(x=>x.alive&&x.born&&x.age>=16&&x.rel>=70);if(sb&&Math.random()<.2){log(`${sb.role} ${sb.n} โผล่มาช่วยไว้ได้ทัน!`,'good');sb.rel+=5;return true}}
 if(my>=en&&tr('memory')&&Math.random()<.08){const a=newArt(1);S.arts.push(a);log(`🧠 ความจำภาพถ่าย: จดจำท่าของ${name}ได้ทั้งหมด — ได้ ${artHtml(a)}`,'epic')}
 if(my<en&&bagHas('tal')&&bagUse('tal')){log(`📜 ยันต์คุ้มกายลุกเป็นไฟ กันการโจมตีถึงตายจาก${name}ไว้ได้ แล้วคุณสวนกลับจนชนะ`,'epic');my=en+1}
 if(my>=en&&S.xian&&Math.random()<.2)bagAdd(Math.random()<.5?'core':'herb',1,1);
 if(my>=en){S.fame+=Math.round(3+Math.sqrt(Math.max(0,ep))/3);S.money+=inc(R(10,60));S.kills++;return true}

}

  if(Math.random()<.5){const a=newArt();S.arts.push(a);log(`ได้รับวิชาพื้นฐานของสำนัก ${artHtml(a)}`)}
  peers.forEach(pp=>{if(pp.alive&&pp.fac===f&&!pp.rel){pp.rel='sect';log(`พบว่า ${pp.name} ที่เกิดวันเดียวกับคุณ อยู่สำนักนี้ด้วย!`,'good')}})}
 else log(`สอบเข้า${f.n}ไม่ผ่าน...`,'bad');
}

}

 {c:()=>S.age>=16&&!!S.faction,f(){return '🏯 '+ch(['ศิษย์น้องแอบเอาขนมมาวางไว้หน้าห้องคุณ','ห้องครัวของสำนักทำบะหมี่อร่อยผิดปกติทั้งปี','มีข่าวลือว่าศิษย์พี่สองคนในสำนักแอบชอบกัน','เจ้าสำนักเผลอหลับระหว่างพิธีไหว้บรรพบุรุษ','แมวของสำนักคลอดลูกห้าตัวในห้องเก็บคัมภีร์','ศิษย์ใหม่ปีนี้มีแต่คนเสียงดัง'])}},
 {c:()=>!!S.spouse&&S.age>=20,f(){joy(4);return `💞 ${S.spouse} `+ch(['ทำอาหารจานโปรดรอคุณกลับบ้าน','ทะเลาะกับคุณเรื่องไร้สาระแล้วคืนดีกันก่อนนอน','แอบเย็บถุงหอมใส่ไว้ในเสื้อคุณ','นั่งฟังคุณบ่นเรื่องสำนักทั้งคืนโดยไม่ขัดสักคำ','ปลูกดอกไม้หน้าบ้านจนบานสะพรั่ง'])}},
 {c:()=>S.age>=3,f(){const[n,d]=ch(FESTIVALS);const dead=(S.parents||[]).filter(p=>!p.alive);if(n==='เทศกาลเชงเม้ง'&&dead.length){joy(-3);return`🏮 ${n} — ไปเช็ดหลุมศพ${dead[0].role} ${dead[0].n} จุดธูปบอกเล่าเรื่องราวในปีที่ผ่านมา`}joy(4);return`🏮 ${n} — ${d}${S.sp?` กับ${S.sp.n}`:''}`}},
 {c:()=>S.age>=4,f(){joy(3);return ch(['❄️ หิมะแรกของปีโปรยลงมา คุณยื่นมือออกไปรับเกล็ดหิมะ','🌧️ ฝนตกหนักทั้งเดือน นั่งฟังเสียงฝนกระทบหลังคา','🌸 ดอกท้อบานทั่วหุบเขา สวยจนลืมหายใจ','🌕 คืนจันทร์เต็มดวง นั่งดื่มชาบนหลังคาคนเดียว','🍂 ลมหนาวแรกพัดมา ใบไม้เปลี่ยนเป็นสีทอง'])}},
 {c:()=>S.age>=8&&!S.pet,f(){const p=ch([['แมวส้ม','🐈'],['หมาดำ','🐕'],['นกกระเรียน','🕊️'],['ลิงน้อย','🐒']]),nm=ch(['เสี่ยวหวง','ต้าไป๋','เฮยจื่อ','เหมาเหมา','ฮวาฮวา']);S.pet={n:nm,t:p[0],i:p[1],age:S.age};joy(8);return`${p[1]} ${p[0]}ตัวหนึ่งเดินตามคุณกลับบ้าน ตั้งชื่อให้ว่า <b>${nm}</b>`}},
 {c:()=>!!S.pet&&!S.pet.spirit,f(){const p=S.pet;if(!p)return'ใช้ชีวิตเรียบง่ายไปอีกปี';if(S.age-p.age>R(10,16)){S.pet=null;joy(-12);return`${p.i} ${p.n} ${p.t}ที่อยู่ด้วยกันมาหลายปี หลับไปตลอดกาลใต้ต้นไม้หน้าบ้าน`}joy(4);return`${p.i} ${p.n} ${ch(['คาบปลามาวางหน้าประตู','นอนขดบนตักตอนคุณนั่งสมาธิ','ไล่จับผีเสื้อทั้งบ่าย','ส่งเสียงเตือนตอนมีคนแปลกหน้าเข้ามา'])}`}},
 {c:()=>S.age>=10,f(){const r=R(1,6);if(r===1){S.int+=3;return'♟️ เล่นหมากล้อมกับชายชราในสวน แพ้ทั้งวันแต่ได้คิดอะไรหลายอย่าง'}if(r===2){S.cha+=3;return'🎵 หัดเล่นพิณจนนิ้วพอง เพลงแรกที่เล่นได้คือเพลงพื้นบ้าน'}if(r===3){joy(4);return'🍜 เจอร้านบะหมี่เล็กๆ ที่อร่อยที่สุดในชีวิต แวะกินทุกครั้งที่ผ่าน'}if(r===4){S.int+=2;return'📜 ซื้อนิยายยุทธภพมาอ่าน หัวเราะกับพระเอกที่เก่งเกินจริง'}if(r===5){joy(3);return'🍶 ดื่มสุรากับคนแปลกหน้าในโรงเตี๊ยม คุยกันถูกคอจนรุ่งเช้า'}S.hp-=5;return'🤧 เป็นหวัดเล็กน้อย ต้องนอนซมอยู่สามวัน'}},
 {c:()=>S.age>=12&&peers.some(p=>p.alive&&p.notes.length),f(){const p=ch(peers.filter(p=>p.alive&&p.notes.length));return`🗣️ ได้ยินข่าวลือในโรงน้ำชาว่า ${p.name} ${p.notes[p.notes.length-1].replace(/^\d+ ปี: /,'')}`}},
 {c:()=>S.ow&&S.awake,f(){joy(-2);return`💭 ${ch(['ฝันถึงโลกเดิม ตื่นมาน้ำตาไหลโดยไม่รู้ตัว','เผลอพูดศัพท์จากโลกเดิม คนรอบข้างมองแปลกๆ','คิดถึงอาหารจากโลกเดิมจนนอนไม่หลับ','มองดาวแล้วสงสัยว่าโลกเดิมอยู่ดวงไหน'])}${S.soul?` — ${S.soul.n}ในอดีตคงไม่คิดว่าจะมาอยู่ตรงนี้`:''}`}},
 {c:()=>S.age>=60,f(){joy(2);return ch(['👴 ผมขาวขึ้นอีกหลายเส้น นั่งดูเด็กๆ ฝึกยุทธ์แล้วนึกถึงตัวเองตอนหนุ่ม','👴 เข่าเริ่มปวดเวลาอากาศเย็น วิชาตัวเบาไม่คล่องเหมือนเก่า','👴 คนรุ่นเดียวกันเหลือน้อยลงทุกปี','👴 เด็กในหมู่บ้านเรียกคุณว่าท่านปู่ท่านย่า แม้จะยังไม่มีหลาน'])}},
 {c:()=>S.age>=6&&S.age<16,f(){joy(3);return ch(['🪁 เล่นว่าวกับเด็กข้างบ้านจนว่าวติดต้นไม้','🐟 แอบไปจับปลาในลำธาร กลับบ้านตัวเปียก','🗡️ เล่นเป็นจอมยุทธ์กับเพื่อนๆ ด้วยดาบไม้','🍬 แลกขนมกับเพื่อนแล้วโดนโกง','📖 แอบอ่านนิยายใต้ผ้าห่มจนถูกจับได้'])}},
 {c:()=>(S.children||[]).some(c=>c.alive&&c.age<12),f(){const c=ch(S.children.filter(c=>c.alive&&c.age<12));joy(5);return`👶 ${c.n} ${ch(['เรียกคุณว่าพ่อแม่ได้เป็นครั้งแรก','หัดเดินได้ก้าวแรก','ถือดาบไม้มาขอให้สอนวิชา','ป่วยเป็นไข้ คุณนั่งเฝ้าทั้งคืน','วาดรูปคุณให้ดู หน้าตาเหมือนลิงมาก'])}`}}];
function sliceOfLife(){const pool=SOL.filter(e=>e.c());if(!pool.length)return;S.solRec=S.solRec||[];let t=null;for(let k=0;k<4&&!t;k++){const x=ch(pool).f();if(x&&!S.solRec.includes(x))t=x}if(!t)return;S.solRec.push(t);if(S.solRec.length>8)S.solRec.shift();ensureHeader();addFeed('ev',t,'')}

// ============ FAMILY & HAPPINESS ============
const PERS_P=['ใจดี','เข้มงวด','เงียบขรึม','ห่วงใย','ขี้เมา','ทะเยอทะยาน'];
const PERS_S=['อ่อนโยน','ดุดัน','ทะเยอทะยาน','ขี้หึง','ร่าเริง','สุขุม'];
const surOf=()=>S.name.includes(' ')?S.name.split(' ')[0]:null;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function joy(d){S.happy=clamp((S.happy==null?60:S.happy)+d,0,100);if(d<=-15)S.grief=(S.grief||0)+Math.abs(d)*.6}
const moodOf=h=>h>=75?['😄','สุขสันต์']:h>=55?['🙂','สบายดี']:h>=40?['😐','เฉยๆ']:h>=25?['😔','เศร้า']:['😭','สิ้นหวัง'];
const hm=()=>S.happy<25?.7:S.happy<40?.85:S.happy>75?1.1:1;
function mkFamily(){
 const F=S.family,sur=surOf();S.parents=[];S.sibs=[];S.children=S.children||[];
 if(F.orphan){S.flags.lostParents=1;return}
 const rich=(F.money||0)>300?6:0;
 S.parents=[{n:sur?genName(F,'ชาย',sur):anyName('ชาย'),role:'พ่อ',g:'ชาย',age:R(20,40),life:R(45,80)+rich,alive:true,p:ch(PERS_P),rel:60},
  {n:anyName('หญิง'),role:'แม่',g:'หญิง',age:R(18,34),life:R(48,82)+rich,alive:true,p:ch(PERS_P.filter(x=>x!=='ขี้เมา')),rel:70}];
 const n=pickW([{w:3,v:0},{w:4,v:1},{w:3,v:2},{w:1.5,v:3}]).v.v;
 for(let i=0;i<n;i++){let off=0;while(!off)off=R(-7,8);const g=ch(['ชาย','หญิง']);
  S.sibs.push({n:genName(F,g,sur||undefined),g,age:off>0?off:0,bornAt:off>0?-1:-off,born:off>0,alive:true,tal:pickW(TALENT).v,fac:null,married:false,rel:R(45,70),role:off>0?(g==='ชาย'?'พี่ชาย':'พี่สาว'):(g==='ชาย'?'น้องชาย':'น้องสาว')})}
}
function familyIntro(){
 if(S.flags.lostParents){log('ไม่มีใครรู้ว่าพ่อแม่ของคุณเป็นใคร มีเพียงผ้าห่อตัวเก่าๆ ผืนหนึ่งติดตัวมา','bad');return}
 const [fa,mo]=S.parents;if(!fa)return;
 const sb=S.sibs.filter(s=>s.born);
 log(`พ่อของคุณคือ <b>${fa.n}</b> (${fa.p}) แม่คือ <b>${mo.n}</b> (${mo.p})${sb.length?` · มี${sb.map(s=>s.role+' '+s.n).join(', ')}`:''}`);
}
function syncFamily(){
 // spouse object
 if(S.spouse&&(!S.sp||S.sp.n!==S.spouse)){S.sp={n:S.spouse,p:ch(PERS_S),aff:72,age:S.age+R(-4,4),life:R(55,85),peer:S.spouseP!=null};joy(25)}
 if(!S.spouse&&S.sp)S.sp=null;
 // children
 S.children=S.children||[];
 while(S.children.length<S.kids){const g=ch(['ชาย','หญิง']),sur=surOf(),used=S.children.map(x=>x.n),pool=(g==='หญิง'?NM.f:NM.m)[S.clan||/ขุนนาง/.test(S.family.n)?'noble':'martial'].concat((g==='หญิง'?NM.f:NM.m).common).filter(x=>!used.includes((sur||'')+' '+x)),c={n:sur?sur+' '+ch(pool.length?pool:NM.m.martial):anyName(g),g,age:0,alive:true,tal:pickW(TALENT).v,fac:null,married:false,grand:0};
  S.children.push(c);joy(15);if(S.age>0)log(`ตั้งชื่อลูกว่า <b>${c.n}</b> (${c.tal.n})`)}
}
function familyTick(){
 syncFamily();
 const F=S.family;let fired=false;
 // parents
 for(const p of S.parents||[]){if(!p.alive)continue;p.age++;
  const sick=p.age>=55&&Math.random()<.012*(p.age-50)/5;
  if(p.age>=p.life||sick){p.alive=false;const d=p.rel<30?-15:-30;joy(d);log(`💔 ${p.role}ของคุณ <b>${p.n}</b> จากไปด้วยวัย ${p.age} ปี`,'bad',true);
   if(S.age>=16&&!fired){fired=inherit2(p)}}
  else if(!fired&&p.age>=58&&S.age>=16&&Math.random()<.07){fired=true;const cost=300+p.age*5;
   choice(`🤒 ${p.role}ล้มป่วย`,`${p.role} ${p.n} วัย ${p.age} ปี ล้มป่วยหนัก`,[
    {t:`จ้างหมอที่ดีที่สุด (${fmt(cost)} ตำลึง)`,s:'ยืดอายุท่าน',f(){if(S.money>=cost){S.money-=cost;p.life+=R(3,8);p.rel+=10;S.flags.filial=(S.flags.filial||0)+1;log(`หมอรักษา${p.role}จนอาการดีขึ้น`,'good')}else log('เงินไม่พอจ้างหมอ','bad')}},
    {t:'กลับบ้านไปดูแลเอง',s:'ความสัมพันธ์ + · เสียเวลาฝึก',f(){p.life+=R(1,4);p.rel+=25;joy(5);S.flags.filial=(S.flags.filial||0)+1;log(`กลับไปดูแล${p.role}ทั้งปี ${p.role}จับมือคุณแน่น "ลูกกตัญญูของพ่อแม่"`,'good')}},
    {t:'ส่งเงินไปแทน แล้วฝึกต่อ',s:'ความสัมพันธ์ −',f(){p.rel-=15;S.money=Math.max(0,S.money-100);log('ส่งเงินกลับบ้าน แต่ไม่ได้กลับไปเยี่ยม')}}])}
  else if(!fired&&p.p==='ขี้เมา'&&S.age<16&&S.age>=4&&Math.random()<.1){joy(-8);S.hp-=5;log(`${p.role}เมากลับบ้านแล้วอาละวาด คุณซ่อนตัวอยู่ใต้โต๊ะทั้งคืน`,'bad')}
  else if(!fired&&p.p==='เข้มงวด'&&S.age>=4&&S.age<14&&Math.random()<.1){S.power+=8;S.int+=3;joy(-3);log(`${p.role}บังคับให้ตื่นตีห้าฝึกทุกวัน เหนื่อยแต่ก็เก่งขึ้น`)}
  else if(!fired&&(p.p==='ใจดี'||p.p==='ห่วงใย')&&S.age>=3&&S.age<14&&Math.random()<.1){joy(6);log(`${p.role}${p.p==='ใจดี'?'ทำขนมโปรดให้กินทุกเทศกาล':'เย็บเสื้อตัวใหม่ให้ แม้มือจะสั่น'}`,'good')}
 }
 // siblings
 for(const s of S.sibs||[]){if(!s.alive)continue;
  if(!s.born){if(S.age>=s.bornAt){s.born=true;s.age=0;joy(8);log(`${s.role} <b>${s.n}</b> ถือกำเนิดขึ้น บ้านมีเสียงเด็กร้องเพิ่มอีกคน`,'good')}continue}
  s.age++;
  const risk=s.age<=5?(F.inf||.05)*(INF_DECAY[s.age-1]||.05):s.age>60?.02:.005;
  if(Math.random()<risk){s.alive=false;joy(s.rel>60?-25:-15);log(`💔 ${s.role} <b>${s.n}</b> จากไปด้วยวัย ${s.age} ปี`,'bad',true);continue}
  if(!s.fac&&s.age>=10&&s.age<=18&&Math.random()<.15){const ok=FACTIONS.filter(f=>f.need(R(-40,40),{family:F,gender:s.g,talent:s.tal,int:50}));if(ok.length){s.fac=ch(ok);if(S.age>=6)log(`${s.role} ${s.n} เข้าร่วม${s.fac.n}`)}}
  if(!s.married&&s.age>=18&&Math.random()<.1){s.married=true;joy(5);if(S.age>=8)log(`${s.role} ${s.n} แต่งงานแล้ว คุณไปร่วมงานเลี้ยง`,'good')}
 }
 if(!fired&&S.age>=14&&Math.random()<.1)fired=sibEvent();
 // spouse
 if(S.sp){const sp=S.sp;sp.age++;
  sp.aff=clamp(sp.aff+({love:8,rest:3,adv:-3,mission:-2,tech:-1}[S.focus]||0)+(S.path==='family'?5:S.path==='assassin'?-4:0)+(sp.p==='ร่าเริง'?2:sp.p==='ขี้หึง'&&S.cha>60?-3:sp.p==='ทะเยอทะยาน'?(S.rank>=2||S.offRank>=2||S.ownSect?3:-2):0),0,100);
  if(!sp.peer&&sp.age>=sp.life){joy(-35);log(`💔 <b>${sp.n}</b> คู่ชีวิตของคุณจากไปด้วยวัย ${sp.age} ปี`,'bad',true);S.spouse=null;S.sp=null}
  else if(!fired&&sp.aff<25&&Math.random()<.35){fired=true;choice('💔 ชีวิตคู่ร้าวฉาน',`${sp.n} (${sp.p}) แทบไม่พูดกับคุณมาหลายเดือน "เจ้ารักกระบี่มากกว่าข้า"`,[
    {t:'ซื้อของขวัญง้อ (300 ตำลึง)',f(){if(S.money>=300){S.money-=300;sp.aff+=25;log(`${sp.n}รับของขวัญแล้วยิ้มออกมาได้`,'good')}else log('ไม่มีเงินซื้อของขวัญ','bad')}},
    {t:'ขอโทษ และสัญญาว่าจะอยู่บ้านมากขึ้น',s:'เปลี่ยนเป็นทุ่มเทให้ครอบครัว',f(){sp.aff+=20;S.focus='love';log('คุณวางกระบี่ลงแล้วจับมือคนรัก','good')}},

const PRESTIGE={'สำนักภูผาขาว':900,'วัดศิลาธรรม':950,'พรรคกระยาจก':850,'สำนักเขาเมฆม่วง':880,'หุบเขาดอกท้อ':700,'สำนักกระบี่สิบทิศ':800,'หุบเขาโอสถเทวดา':650,

function rankPos(){const o={};rankList().forEach((x,i)=>o[x.n]=i+1);return o}
const sectPos=n=>rankPos()[n]||99;

 const L=rankList(),pos=rankPos();

 else if(b<=3&&a>3)log(`📜 ${mine} ขึ้นสู่สามอันดับแรกของทำเนียบ (อันดับ ${b})`,'epic');

}
function openRanking(){if(!S)return;if(!S.sr||!S.sr.sc)initRank();

   o.push({t:'ลงมือ',s:'กรรม −−',f(){S.karma-=15;S.kills++;ex(true,'เลือดสาดลงบนแท่นบูชา เสียงโห่ร้องดังก้องถ้ำ')}});

 const sc=EX.score,wow=EX.wow;EX=null;
 if(pass){S.faction=f;S.rank=0;S.merit=sc===3?15:0;S.everFac=true;if(sc===3)S.flags.examPerfect=1;

  if(Math.random()<.5){const a=newArt();S.arts.push(a);log(`ได้รับวิชาพื้นฐานของสำนัก ${artHtml(a)}`)}
  peers.forEach(pp=>{if(pp.alive&&pp.fac===f&&!pp.rel){pp.rel='sect';log(`พบว่า ${pp.name} ที่เกิดวันเดียวกับคุณ อยู่สำนักนี้ด้วย!`,'good')}});
  const n=sc===3||wow?3:Math.random()<.5?2:1;offerMasters(n,false);return}

 o.push({t:'กลับไปฝึกให้หนัก แล้วค่อยลองใหม่',s:'ปีหน้าสมัครเองได้ในเมนูสำนัก',f(){S.power+=10;log('กัดฟันกลับบ้าน สาบานว่าจะกลับมาให้ได้')}});
 choice('😞 สอบไม่ผ่าน',`ผ่านเพียง ${sc}/3 ด่าน ไม่พอสำหรับ${f.n}<br>ระหว่างเดินลงเขา มีคนจากสำนักเล็กแถวนั้นมาทาบทาม`,o);
}

const LINES={'ธรรมะ':[['สายกระบี่','train',1.25,['กระบี่','เพลงกระบี่']],['สายฝ่ามือ','train',1.2,['ฝ่ามือ']],['สายลมปราณ','qi',1.3,['คัมภีร์ลมปราณ']],['สายการแพทย์','med',1,['นิ้วชี้','เข็มทอง']]],

const MOODS=[['เข้มงวด','ฝึกโหดจนเจ็บตัว แต่ได้ผลเพิ่ม'],['ใจดี','ดูแลใกล้ชิด สอนวิชาให้บ่อย'],['ประหลาด','คาดเดาไม่ได้ บางทีก็ให้ของดีเฉยๆ'],['เย็นชา','ไม่ค่อยพูด แต่พลังสูงกว่าคนอื่น']];
function mkMaster(minor){
 const T=S.faction.t,L=ch(LINES[T]),M=ch(MOODS),me=realmIdx(),g=ch(['ชาย','หญิง']);
 let up=minor?R(0,2):R(1,3);if(M[0]==='เย็นชา')up++;const mri=Math.min(7,Math.max(minor?1:2,me+up));
 const mult=+(L[2]+.05*(mri-me)+(M[0]==='เข้มงวด'?.1:0)-(minor?.08:0)).toFixed(2);
 return{n:anyName(g),g,line:L[0],k:L[1],mult:Math.max(1.05,mult),mood:M[0],md:M[1],ri:mri,y:0,words:L[3]};
}
function mEff(m){return m.k==='train'?`ฝึกยุทธ์ ×${m.mult}`:m.k==='qi'?`ลมปราณ ×${m.mult}`:m.k==='fight'?`ต่อสู้ ×${m.mult}`:m.k==='med'?'ตายจากโรคยากขึ้นมาก · ปัญญาเพิ่ม':'ปัญญาและเงินเพิ่มทุกปี'}
function offerMasters(n,minor,why){
 if(!S.faction||n<=0)return;const ms=Array.from({length:n},()=>mkMaster(minor));
 const o=ms.map(m=>({t:`👴 ผู้อาวุโส${m.n} — ${m.line}`,s:`${REALMS[m.ri].n} · นิสัย${m.mood} (${m.md}) · ${mEff(m)}`,f(){S.smaster=m;log(`คำนับผู้อาวุโส<b>${m.n}</b>แห่ง${m.line}เป็นอาจารย์ (${REALMS[m.ri].n})`,'epic',true);setScene('master')}}));
 o.push({t:'ไม่ฝากตัวกับใคร ฝึกตามลำดับขั้น',s:'อิสระ',f(){log('ปฏิเสธอย่างสุภาพ ขอฝึกตามลำดับขั้นเหมือนศิษย์ทั่วไป')}});
 choice('👴 ผู้อาวุโสเห็นแวว',`${why||`หลังการสอบ ผู้อาวุโสของ${S.faction.n} ${n} คนเรียกคุณไปพบ`} — ${n>1?'ต่างคนต่างอยากรับคุณเป็นศิษย์':'อยากรับคุณเป็นศิษย์'}<br><span class="tag2">พลังของคุณ: ${REALMS[realmIdx()].n} (${fmt(total())})</span>`,o);
}
const smb=k=>(S.smaster&&S.smaster.k===k&&!S.smaster.surpass?S.smaster.mult:1);

 if(m.k==='int'){S.int+=3;S.money+=inc(100)}if(m.k==='med')S.int+=2;

 if(Math.random()<.18){

  else if(m.mood==='ประหลาด'){const r=R(1,3);if(r===1){S.qi+=3;log(`👴 ผู้อาวุโส${m.n}จู่ๆ ก็ตบหลังคุณแรงๆ ทีหนึ่ง — ชีพจรที่อุดตันทะลวงเปิด ลมปราณ +3 ปี`,'epic')}else if(r===2){S.money+=inc(500);log(`👴 ผู้อาวุโส${m.n}โยนถุงเงินให้แล้วบอกว่า "ไปซื้อสุรามาให้ข้า ที่เหลือเก็บไว้"`,'good')}else log(`👴 ผู้อาวุโส${m.n}ให้คุณกวาดลานทั้งปีโดยไม่สอนอะไรเลย... หรือนี่คือบททดสอบ?`)}

function rcpRand(maxLv){crInit();const L=Object.keys(RCP).filter(k=>!S.cr.rec.includes(k)&&RCP[k].lv<=maxLv);return L.length?ch(L):null}
function crOdds(id){const r=RCP[id],k=r.k,t=S.cr.tool[k];return Math.max(.1,Math.min(.95,.5+(S.cr.lv[k]-r.lv)*.12+(t?t.lv*.05:0)+S.int/3000))}
function crCan(id){const r=RCP[id],t=S.cr.tool[r.k];if(!t)return'ยังไม่มี'+CRK[r.k].tool;if(t.dur<=0)return CRK[r.k].tool+'พัง';for(const m in r.m)if(bagN(m)<r.m[m])return'วัตถุดิบไม่พอ';return''}
function crOnce(id){const r=RCP[id],k=r.k,t=S.cr.tool[k];if(t.dur<=0&&S.cr.repair){const c=Math.round(TOOL_C[t.lv-1]*.3);if(S.money>=c){S.money-=c;t.dur=TOOL_D[t.lv-1]}}
 if(crCan(id))return null;for(const m in r.m)bagTake(m,r.m[m]);const ok=Math.random()<crOdds(id);t.dur-=ok?1:2;S.cr.xp[k]+=ok?2:1;
 if(S.cr.xp[k]>=S.cr.lv[k]*6&&S.cr.lv[k]<9){S.cr.xp[k]=0;S.cr.lv[k]++;log(`${CRK[k].ic} ฝีมือ${CRK[k].n}ขึ้นเป็นขั้น <b>${S.cr.lv[k]}</b>`,'epic')}
 if(!ok)return{ok:false};const x=Math.random(),gr=x<.04+S.cr.lv[k]*.02?3:x<.22?2:x<.6?1:0;const o=r.out;
 if(o.bag)bagAdd(o.bag,o.q*GRADE_Q[gr],true);
 else if(o.eq){eqInit();S.eqInv[o.eq]=(S.eqInv[o.eq]||0)+1;if(S.eqAuto){const it=EQI[o.eq],sl=it.s==='acc'?['acc1','acc2']:[it.s];const emp=sl.find(s0=>!S.eq[s0]);if(emp)eqPut(emp,o.eq)}if(gr===3){const b=eqDrop(Math.min(4,S.cr.lv[k]));S.eqInv[b]=(S.eqInv[b]||0)+1}}
 else if(o.fx==='int')S.int+=Math.round(o.v*GRADE_M[gr]);else if(o.fx==='life')S.lifespan+=Math.round(o.v*GRADE_M[gr]);else if(o.fx==='qi')S.qi+=o.v*GRADE_M[gr];
 else if(o.fx==='weapon'){const cur=gearOf('weapon'),i=cur?GEAR.weapon.indexOf(cur):-1,nx=GEAR.weapon[i+1];if(nx){S.gear=S.gear||{};S.gear.weapon=nx.id}else S.power+=60}
 else if(o.buf){S.buf=S.buf.filter(b=>b.k!==o.buf);S.buf.push({k:o.buf,v:o.buf==='red'?o.v*GRADE_M[gr]:1+(o.v-1)*GRADE_M[gr],u:S.age+o.y,n:r.n})}
 return{ok:true,gr}}
function crRun(id,n,tag){const r=RCP[id];let ok=0,done=0,best=-1,why='';for(let i=0;i<n;i++){const why0=crCan(id);if(why0&&!(why0.endsWith('พัง')&&S.cr.repair)){why=why0;break}const res=crOnce(id);if(!res){why=crCan(id);break}done++;if(res.ok){ok++;best=Math.max(best,res.gr)}}
 if(done)log(`${CRK[r.k].ic} ${tag||'งานช่าง'}: ${r.n} ${done} ครั้ง · สำเร็จ ${ok}${best>=0?' · ดีที่สุด '+GRADE[best]:''}${why?' · หยุดเพราะ'+why:''}`,ok?'good':'bad');
 else if(why&&tag)log(`${CRK[r.k].ic} ${r.n}: ทำไม่ได้ — ${why}`,'bad');return done}
const bufM=k=>{let m=1;for(const b of (S&&S.buf)||[])if(b.k===k&&S.age<b.u)m*=b.v;return m};
const bufA=k=>{let s=0;for(const b of (S&&S.buf)||[])if(b.k===k&&S.age<b.u)s+=b.v;return s};

function crManual(id,k){crInit();if(S.cr.y!==S.age){S.cr.y=S.age;S.cr.man=0}if(S.cr.man>=3)return toast('ปีนี้ลงมือเองครบ 3 ครั้งแล้ว — ตั้งเป็นงานประจำหรือเลือกจุดมุ่งหมาย 🔨 งานช่าง');const w=crCan(id);if(w)return toast(w);S.cr.man++;crRun(id,1,'ลงมือเอง');render();openCraft(k)}
function openCraft(k){crInit();k=k||'alch';const t=S.cr.tool[k],L=S.cr.rec.filter(id=>RCP[id].k===k);
 const tabs=Object.keys(CRK).map(x=>`<button class="tabb ${x===k?'on':''}" onclick="openCraft('${x}')">${CRK[x].ic} ${CRK[x].n}</button>`).join('');
 modal(`<button class="xbtn" onclick="closeM()">✕</button><h3>🔨 งานช่าง</h3><div class="tabs">${tabs}</div>

 <div class="item"><div class="h"><b>${CRK[k].tool}: ${t?TOOLS[k][t.lv-1]+` (ทนทาน ${Math.max(0,t.dur)}/${TOOL_D[t.lv-1]})`:'ยังไม่มี'}</b><span>${t&&t.dur<TOOL_D[t.lv-1]?`<button class="sysb" onclick="toolFix('${k}')">ซ่อม ${fmt(Math.round(TOOL_C[t.lv-1]*.3))}</button> `:''}${!t||t.lv<4?`<button class="sysb" onclick="toolBuy('${k}')">${t?'อัปเกรด':'ซื้อ'} ${fmt(TOOL_C[t?t.lv:0])}</button>`:''}</span></div><p>${CRK[k].tool}ดีขึ้น โอกาสสำเร็จสูงขึ้น · สำเร็จ −1 ทนทาน ล้มเหลว −2</p></div>
 <label class="tag2" style="display:block;margin:6px 0"><input type="checkbox" ${S.cr.repair?'checked':''} onchange="S.cr.repair=this.checked?1:0"> ซ่อมเครื่องมือเองเมื่อพัง (ใช้เงิน 30% ของราคา)</label>
 <h4 style="margin:8px 0 4px">ตำรับที่รู้</h4>${L.length?L.map(id=>{const r=RCP[id],w=crCan(id);return`<div class="item ${S.cr.job===id?'pin':''}"><div class="h"><b>${r.n} <span class="tag2">ขั้น ${r.lv}</span></b><span><button class="sysb" onclick="crManual('${id}','${k}')" ${w?'disabled style="opacity:.45"':''}>ลงมือ</button> <button class="sysb" onclick="S.cr.job=S.cr.job==='${id}'?null:'${id}';openCraft('${k}')">${S.cr.job===id?'✔ งานประจำ':'ตั้งเป็นงานประจำ'}</button></span></div><p>${Object.keys(r.m).map(m=>`${BAGIT[m].ic}${BAGIT[m].n} ${bagN(m)}/${r.m[m]}`).join(' · ')}<br><span class="tag2">โอกาสสำเร็จ ~${Math.round(crOdds(id)*100)}%${w?' · '+w:''}</span></p></div>`}).join(''):'<p class="tag2">ยังไม่รู้ตำรับ — ได้จากการศึกษา สำนัก ท่องยุทธภพ ดันเจี้ยน หรือซื้อในเมือง</p>'}
 ${S.buf.length?`<h4 style="margin:8px 0 4px">ค่ายกลที่ทำงานอยู่</h4>`+S.buf.map(b=>`<div class="tag2">🔯 ${b.n} · เหลือ ${b.u-S.age} ปี</div>`).join(''):''}`,'craft')}

function peopleAll(){const L=[];if(!S)return L;
 (S.parents||[]).forEach((p,i)=>L.push({key:'par'+i,n:p.n,role:p.role+(p.pt&&p.pt!=='love'?' ('+ptN(p.pt)+')':''),alive:p.alive,rel:p.rel,o:p,grp:'fam',age:p.age}));
 (S.sibs||[]).forEach((p,i)=>{if(p.born===false)return;L.push({key:'sib'+i,n:p.n,role:p.role,alive:p.alive,rel:p.rel,o:p,grp:'fam',age:p.age})});
 (S.children||[]).forEach((p,i)=>L.push({key:'kid'+i,n:p.n||('บุตรคนที่ '+(i+1)),role:p.role||'บุตร',alive:p.alive!==false,rel:p.rel,o:p,grp:'fam',age:p.age}));
 if(S.spouse)L.push({key:'spouse',n:S.spouse,role:'คู่ชีวิต',alive:true,rel:S.spRel==null?(S.spRel=75):S.spRel,grp:'fam',o:S,rk:'spRel'});
 if(S.arc&&S.arc.master)L.push({key:'master',n:S.arc.master.n,role:'อาจารย์',alive:S.arc.master.alive,rel:S.arc.master.rel==null?(S.arc.master.rel=60):S.arc.master.rel,grp:'mas',o:S.arc.master});
 peers.forEach((p,i)=>{if(p.af==null)p.af=p.rel==='friend'?75:p.rel==='spouse'?80:p.rel==='rival'?-20:p.rel==='sect'?45:25;L.push({key:'peer'+i,n:p.name,role:p.rel?REL[p.rel]:'เกิดพร้อมคุณ',alive:p.alive,rel:p.af,grp:p.rel==='rival'?'foe':'fri',o:p,rk:'af',age:p.age,peer:i})});
 if(S.nem)L.push({key:'nem',n:S.nem.n,role:'😈 คู่แค้น',alive:!!S.nem.alive,rel:S.nem.peace?10:-80,grp:'foe'});
 if(S.pet)L.push({key:'pet',n:S.pet.n||'สัตว์เลี้ยง',role:(S.pet.i||'🐾')+' สัตว์คู่ใจ',alive:true,rel:90,grp:'fri'});
 return L}

 log(`🍵 ${ch(['นั่งดื่มชากับ','ไปเดินตลาดกับ','ฝึกยุทธ์ด้วยกันกับ','นั่งคุยทั้งคืนกับ','ไปไหว้พระกับ'])} <b>${it.n}</b> (สนิทกัน +${d})`,'good');render();openPeople(openPeople._f)}

  <p>${x.role}${x.age!=null?' · อายุ '+x.age:''}${r!=null?` · <span style="color:${r>=50?'#3a9a5a':r<0?'#c84a4a':'inherit'}">${r>0?'+':''}${r}</span>`:''}</p>

 else{const line=(S.lineage||[]).map((p,i)=>`<div class="chr"><b>รุ่นที่ ${i+1} · ${p.n}</b><small>「${p.e||'—'}」 · อายุ ${p.a} ปี</small></div>`).join('');

 {id:'d6',n:'วังสวรรค์ที่ร่วงหล่น',ic:'🏯',ri:5,ep:5200,mob:['ทหารสวรรค์ไร้วิญญาณ','กิเลนหิน','เทพพิทักษ์ร้าว'],boss:'แม่ทัพสวรรค์ผู้ถูกลืม',lt:4,mat:['jade','silk','core']},
 {id:'d7',n:'ซากเทพบรรพกาล',ic:'🗿',ri:6,ep:12000,mob:['เศษเสี้ยวเทพ','อสูรบรรพกาล','เงาแห่งความว่างเปล่า'],boss:'จิตสำนึกเทพที่หลับใหล',lt:5,mat:['jade','core','ink']}];

let DG=null;

 DUNG.map(d=>{const lock=realmIdx()<d.ri,cl=(S.dgClr||[]).includes(d.id),rate=Math.round(Math.min(.95,myPow()/(myPow()+d.ep*1.3))*100);return`<div class="item ${lock?'dead':''}"><div class="h"><b>${d.ic} ${d.n}${cl?' ✅':''}</b><button class="sysb" onclick="dgStart('${d.id}')" ${lock||!dgReady()?'disabled style="opacity:.45"':''}>ลงไป</button></div><p>${lock?'ต้องถึงขั้น '+REALMS[d.ri].n:`บอส: ${d.boss} · โอกาสชนะต่อไฟต์ ~${rate}%`}</p></div>`}).join(''),'dungeon')}

function dgFight(name,ep){const my=myPow()*(.75+Math.random()*.5),en=ep*(.75+Math.random()*.5);const win=my>=en;const dmg=Math.round((win?R(4,12):R(15,35))*(1-gv('armor','red')-eqA('red')-bufA('red'))*(compList().length?.85:1));S.hp-=Math.max(1,dmg);return{win,dmg}}
function dgStep(){if(!DG||DG.over)return;const d=DG.d;DG.room++;const last=DG.room>=6;let t='';
 if(last){const r=dgFight(d.boss,d.ep*1.8);if(r.win){t=`👑 ห้องบอส: ปราบ <b>${d.boss}</b> ได้! (เสียพลังชีวิต ${r.dmg})`;S.fame+=15*d.lt;S.kills++;dgLoot(ch(d.mat),R(2,4));dgLoot('core',R(1,2));const e=eqDrop(d.lt);DG.eq.push(e);if(Math.random()<.6){const rc=rcpRand(d.lt+1);if(rc)DG.rc.push(rc)}S.dgClr=[...new Set([...(S.dgClr||[]),d.id])];sfx('rare')}
  else t=`💀 ห้องบอส: <b>${d.boss}</b> แข็งแกร่งเกินไป ถูกซัดกระเด็นออกมา (เสียพลังชีวิต ${r.dmg})`;DG.over=true}
 else{const x=Math.random();
  if(x<.5){const m=ch(d.mob),r=dgFight(m,d.ep*(.7+DG.room*.08));if(r.win){t=`⚔️ ห้อง ${DG.room}: ชนะ<b>${m}</b> (−${r.dmg} พลังชีวิต)`;S.kills++;if(Math.random()<.5)dgLoot(ch(d.mat),1)}else{t=`🩸 ห้อง ${DG.room}: พ่ายให้<b>${m}</b> ต้องหนีไปอีกทาง (−${r.dmg} พลังชีวิต)`}sfx('hit')}
  else if(x<.68){const m=ch(d.mat),n=R(1,3);dgLoot(m,n);t=`📦 ห้อง ${DG.room}: พบหีบเก่า — ${BAGIT[m].ic}${BAGIT[m].n} ×${n}`;if(Math.random()<.15){const e=eqDrop(d.lt);DG.eq.push(e);t+=` และ ${EQI[e].ic}${EQI[e].n}!`}sfx('good')}

  else if(x<.92){const h=R(15,30);S.hp=Math.min(S.maxHp,S.hp+h);t=`💧 ห้อง ${DG.room}: พบตาน้ำวิญญาณ ได้พักฟื้น (+${h} พลังชีวิต)`}
  else{const rc=rcpRand(d.lt+1);if(rc){DG.rc.push(rc);t=`📖 ห้อง ${DG.room}: พบม้วนตำรับเก่าบนแท่นหิน`}else{dgLoot('herb',2);t=`🌿 ห้อง ${DG.room}: สวนสมุนไพรร้าง`}}}
 DG.log.push(t);if(S.hp<=0){DG.over=true;DG.log.push('⚠️ หมดสติกลางดันเจี้ยน…')}dgDraw()}
function dgEnd(){if(!DG)return;const d=DG.d,parts=[];for(const k in DG.loot){const got=bagAdd(k,DG.loot[k],true);parts.push(BAGIT[k].ic+BAGIT[k].n+'×'+DG.loot[k])}
 DG.eq.forEach(e=>{eqInit();S.eqInv[e]=(S.eqInv[e]||0)+1;parts.push(EQI[e].ic+EQI[e].n);if(S.eqAuto){const it=EQI[e],sl=it.s==='acc'?['acc1','acc2']:[it.s],emp=sl.find(s0=>!S.eq[s0]);if(emp)eqPut(emp,e)}});

 <div class="dglog">${DG.log.map(x=>`<div>${x}</div>`).join('')||'<div class="tag2">ประตูหินค่อยๆ เปิดออก ความมืดและกลิ่นอับชื้นลอยออกมา…</div>'}</div>
 ${DG.over||S.hp<=0?`<button class="pbtn" style="width:100%" onclick="dgEnd()">ออกจากดันเจี้ยน</button>`:`<div class="brow"><button class="gbtn" onclick="dgEnd()">🏃 ถอยออก</button><button class="pbtn" onclick="dgStep()">${DG.room>=5?'👑 เข้าห้องบอส':'เดินต่อ ▶'}</button></div>`}`,'dungeon');

function blAdvance(){const m=S.beastMode;const need=[[3,0,0],[12,6,0],[0,20,450],[0,45,1500]];if(m.st>=4)return;const [age,qi,pow]=need[m.st];
 if(S.age>=age&&S.qi>=qi&&total()>=pow){m.st++;log(`🌟 ${S.name} ก้าวสู่ขั้น <b>${BL_ST[m.st]}</b>!${m.st===2?' — เริ่มเข้าใจภาษามนุษย์ และมีความคิดเป็นของตัวเอง':m.st===4?' — ทัณฑ์ฟ้าผ่านพ้น พลังเทียบเท่ายอดฝีมือมนุษย์':''}`,'myth',true);S.maxHp+=20;S.hp=S.maxHp;
  if(m.st===4){const tryC=()=>{if(choice._cur||modalOpen)return setTimeout(tryC,600);choice('🌙 ทางแยกของอสูรพันปี',`พลังของ${esc(S.name)}มาถึงขีดที่แปลงกายได้แล้ว<br>จะทิ้งร่างสัตว์ไปใช้ชีวิตเป็นมนุษย์ หรือครองป่าเป็นราชาอสูร?`,[
   {t:'🧑 แปลงกายเป็นมนุษย์',s:'เล่นต่อในร่างคน พลังเดิมติดตัว',f(){m.human=1;const g0=S.gender;S.name=anyName(g0);S.family=Object.assign({},S.family,{n:'อสูรแปลงกาย'});S.focus='train';S.flags.transformed=1;log(`✨ ร่างสัตว์สลายเป็นแสง กลายเป็นมนุษย์รูปงามชื่อ <b>${S.name}</b> — ก้าวเข้าสู่โลกมนุษย์`,'myth',true);setScene('aura');render()}},
   {t:'👑 ครองป่าเป็นราชาอสูร',s:'อยู่ในร่างสัตว์ต่อ ขยายอาณาเขต',f(){m.king=1;S.fame+=200;log(`👑 ${S.name} ประกาศตนเป็นราชาอสูรแห่ง${ch(BHAB[S.xian?1:0])} สัตว์ทั้งป่าก้มหัวให้`,'myth',true)}}])};setTimeout(tryC,400)}}}
function beastYear(){yearSum();yearSnap();const m=S.beastMode,f=S.focus;const mul=S.talent.m*(S.xian?1.4:1);
 if(f==='hunt'){S.power+=Math.round(R(8,18)*mul*(1+m.st*.6));if(Math.random()<.25)S.hp-=R(4,12);joy(2)}else if(f==='moon'){S.qi+=+(R(6,14)/10*mul*(m.st>=1?1.5:.6)).toFixed(1)}else if(f==='roam'){S.int+=R(1,3);if(Math.random()<.35){const b=beastPick(true);bdexAdd(b,'see');addFeed('ev',`🐾 พบ${b.n}ระหว่างท่องป่า แอบมองแล้วจากมา`,'sum')}}else if(f==='hide'){S.hp=Math.min(S.maxHp,S.hp+25);joy(3)}else if(f==='human'){S.int+=R(2,5);S.cha+=1;if(Math.random()<.2){S.hp-=R(10,20);log('🏘️ ชาวบ้านเห็นเข้า ไล่ตีด้วยไม้และคบไฟ','bad')}}
 S.age++;ensureHeader();S.hp=Math.min(S.maxHp,S.hp+R(4,9));
 if(S.age>2&&Math.random()<.55){const ev=ch(BL_EV);runE(ev)}else if(S.age%4===0)addFeed('ev',ch(['ฤดูกาลผันเปลี่ยน ป่ายังคงเงียบสงบ','ล่าเหยื่อ นอน ตื่น แล้วล่าอีก','นอนอาบแดดบนหินก้อนโปรด','ฝนตกทั้งเดือน ขดตัวอยู่ในโพรง']),'');
 if(S.age%3===0&&Math.random()<.4&&m.st>=1)tideTick();
 blAdvance();render();checkDeath();saveGame()}

const evSeen=()=>LS.get('murim_evseen',{});
function evMark(k){const d=evSeen(),was=d[k]||0;d[k]=was+1;LS.set('murim_evseen',d);return was}
function evW(k,w){const n=evSeen()[k]||0;return w*(n?1/(1+n*.6):1.8)}
function newTag(k){if(!(evSeen()[k]))addFeed('ev','✨ เหตุการณ์ใหม่ที่ไม่เคยเจอมาก่อน','sum')}

let AC=null,sfxOn=LS.get('murim_sfx',true),bgmOn=LS.get('murim_bgm',true),bgmT=null,sfxLast={};
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(AC.state==='suspended')AC.resume().catch(()=>{});return AC}
function tone(f,d,type='square',vol=.05,when=0,slide){const a=ac();if(!a)return;vol*=tone._b?VOL.b:VOL.s;if(vol<=0.0002)return;const t=a.currentTime+when,o=a.createOscillator(),gn=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(gn);gn.connect(a.destination);o.start(t);o.stop(t+d+.02)}
function noise(d,vol=.06){const a=ac();if(!a)return;vol*=VOL.s;const b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),ch0=b.getChannelData(0);for(let i=0;i<ch0.length;i++)ch0[i]=(Math.random()*2-1)*(1-i/ch0.length);const s=a.createBufferSource(),gn=a.createGain();s.buffer=b;gn.gain.value=vol;s.connect(gn);gn.connect(a.destination);s.start()}

// ============ DUEL (เลือกท่าเอง) ============
let DU=null;
function duel(name,ep,cb){
 if(auto){const w=fight(name,ep);cb(w);render();checkDeath();return}
 setScene('fight');sfx('hit');
 DU={name,ep,me:100,en:100,r:1,secret:S.arts.length>0,charge:false,txt:'',cb};
 const best=S.arts.slice().sort((a,b)=>b.b-a.b)[0];DU.art=best?best.n:null;
 DU.arts=S.arts.slice().sort((a,b)=>b.b-a.b).slice(1,3);DU.used={};
 DU.intent=duelIntent();drawDuel();
}
function duelIntent(){if(DU.charge)return'atk';const r=Math.random();return r<.45?'atk':r<.75?'def':'chg'}
function drawDuel(fin){
 const hint={atk:'ขยับเท้า เตรียมบุกเข้ามา',def:'ตั้งการ์ดแน่นหนา',chg:'หลับตารวบรวมลมปราณ'};
 const shown=tr('eye')||Math.random()<.7?DU.intent:ch(['atk','def','chg']);
 const bar=(v,c)=>`<div class="hpbar" style="height:10px"><i style="width:${Math.max(0,v)}%;background:${c}"></i></div>`;
 modal(`<h3>⚔️ ดวลกับ ${DU.name}</h3>
 <div class="tag2">คุณ · ${Math.max(0,Math.round(DU.me))}</div>${bar(DU.me,'#5fbf6f')}
 <div class="tag2" style="margin-top:6px">${DU.name} · ${Math.max(0,Math.round(DU.en))}${DU.charge?' ⚡ รวมพลังแล้ว!':''}</div>${bar(DU.en,'#ff5d73')}

function duelAct(a){
 const e=DU.intent,myP=total()*(has('plasma')?1.6:1),ratio=Math.max(.35,Math.min(3,myP/DU.ep)),rr=()=>.8+Math.random()*.4;
 const md=22*Math.pow(ratio,.7)*rr(),ed=22/Math.pow(ratio,.7)*rr()*(DU.charge?1.8:1);
 if(a==='flee'){S.hp-=R(5,15);DU.txt='คุณถอยหนีออกจากวงต่อสู้';return duelEnd(false,true)}
 let t='';
 if(duelX(a,e,md,ed))t=DU._t;
 if(a==='atk'){if(e==='atk'){DU.en-=md;DU.me-=ed*.8;t='ทั้งคู่พุ่งเข้าปะทะ! กระบี่กระทบกันเสียงดังสนั่น';sfx('hit')}else if(e==='def'){DU.en-=md*.35;DU.me-=ed*.4;t='คุณบุก แต่ศัตรูตั้งรับไว้แน่น แล้วสวนกลับมา';sfx('block')}else{DU.en-=md*1.5;t='คุณบุกเข้าไปขณะศัตรูรวมพลัง! ขัดจังหวะได้อย่างสวยงาม';sfx('hit')}}
 if(a==='def'){if(e==='atk'){DU.en-=md*.6;DU.me-=ed*.2;t='ศัตรูบุกเข้ามา คุณเบี่ยงหลบแล้วสวนกลับได้!';sfx('block')}else if(e==='def'){DU.me=Math.min(100,DU.me+5);t='ทั้งคู่ตั้งการ์ดจ้องกัน ต่างฝ่ายต่างหายใจหอบ';}else{DU.me=Math.min(100,DU.me+3);t='คุณตั้งรับ แต่ศัตรูฉวยโอกาสรวบรวมพลังได้สำเร็จ!'}}
 if(a==='sec'){DU.secret=false;DU.en-=md*2.2;if(e==='atk')DU.me-=ed*.7;t=`คุณปล่อยวิชาลับ 《${DU.art}》 ออกไปเต็มกำลัง!`;sfx('rare')}
 DU.charge=(e==='chg'&&a!=='atk');
 if(DU.poison){DU.en-=DU.poison;t+=` <span class="tag2">☠️ พิษ −${DU.poison}</span>`}
 if(DU.me<=0){const g=S.items.find(i=>i.id==='gun'&&i.left>0);if(g){g.left--;S.flags.gun=1;DU.en=0;DU.me=5;t+='<br>จวนตัว! คุณชักปืนออกมา <b>ปัง!</b>'}}
 DU.txt=t;DU.r++;
 if(DU.me<=0||DU.en<=0||DU.r>6)return duelEnd(DU.en<=0||(DU.me>0&&DU.r>6&&DU.me>DU.en));
 DU.intent=duelIntent();drawDuel();
}
function duelEnd(win,fled){
 S.hp-=Math.round((100-Math.max(0,DU.me))*.45);
 if(!win)joy(-5);
 if(win){S.fame+=Math.round(DU.ep/25)+5;S.kills++;joy(4);sfx('realm');if(S.sys){gainExp(30);if(S.sys.t==='demon')S.power+=40*S.sys.lv}}else sfx('bad');
 const cb=DU.cb;
 drawDuel(`<p style="font-size:18px;text-align:center"><b>${win?'🏆 ชนะ!':fled?'🏃 หนีรอดมาได้':'💀 พ่ายแพ้'}</b></p><button class="pbtn" style="width:100%;font-size:16px;padding:10px" onclick="closeM();DU=null;(${'window._dcb'})(${win});render();checkDeath()">ต่อไป</button>`);
 window._dcb=cb;
}

function goalCheck(){
 if(!S.goal||S.goalDone)return;const g=goalOf(S.goal);
 if(g.c()){S.goalDone=true;S.fame+=50;joy(20);S.flags.goal=1;log(`🎯 <b>ปณิธานสำเร็จ: ${g.n}</b> — สิ่งที่ตั้งใจไว้ตั้งแต่เกิด ในที่สุดก็เป็นจริง`,'myth',true);setScene('aura')}
}

function pathOK(k){const ri=realmIdx();switch(k){
 case 'founder':return !S.ownSect&&ri>=2&&(S.fame>=80||S.money>=2000);
 case 'official':return (S.int>=60||ri>=2)&&!(S.faction&&S.faction.t==='มาร')&&S.karma>-30&&S.path!=='official';
 case 'hermit':return (S.age>=30||ri>=3)&&S.path!=='hermit';
 case 'assassin':return S.karma<=10&&ri>=1&&S.path!=='assassin';
 case 'family':return (!!S.spouse||S.age>=30)&&S.path!=='family';
 default:return true}}
function pathWhy(k){return{founder:'ต้องถึงขั้นสอง + ชื่อเสียง 80 หรือเงิน 2,000',official:'ต้องมีปัญญา 60 หรือถึงขั้นสอง และไม่ใช่ฝ่ายมาร',hermit:'ต้องอายุ 30 หรือถึงขั้นหนึ่ง',assassin:'ต้องกรรมไม่เกิน +10 และถึงขั้นสาม',family:'ต้องมีคู่ครองหรืออายุ 30'}[k]||''}
function crossroad(){
 const cur=S.path&&S.path!=='continue'?PATHS[S.path]:null;
 const heirPending=S.heir&&!S.heir.done&&!S.heir.defect&&!S.heir.hidden;
 const keys=['continue','founder','official','hermit','assassin','family'].filter(k=>!(S.ownSect&&k==='founder')&&!(heirPending&&['founder','hermit','official','assassin'].includes(k)));
 const opts=keys.map(k=>{const P2=PATHS[k],ok=pathOK(k);return{t:`${P2.i} ${k==='continue'&&cur?'อยู่บนเส้นทาง "'+cur.n+'" ต่อไป':P2.n}`,s:ok?P2.d:'🔒 '+pathWhy(k),skip:!ok,f(){if(!ok){log('เส้นทางนั้นยังไม่เปิดให้คุณ');return}setPath(k)}}});
 choice(`🛤️ ทางแยกของชีวิต — อายุ ${S.age}`,`อีกสิบปีผ่านไป ${esc(S.name)} ยืนอยู่บนทางแยก${cur?` (ตอนนี้: ${cur.i} ${cur.n})`:''}<br>ทศวรรษหน้าจะใช้ชีวิตอย่างไร?`,opts);
}

@keyframes frShift{0%,100%{border-color:var(--c1);box-shadow:0 0 0 2px var(--line),0 0 8px var(--c1)}50%{border-color:var(--c2);box-shadow:0 0 0 2px var(--line),0 0 10px var(--c2)}}
.fr-pulse{animation:frPulse 3.5s ease-in-out infinite}

.frsp{position:absolute;width:7px;height:7px;pointer-events:none;background:radial-gradient(circle,#fff 0 20%,var(--c2) 35%,transparent 70%);border-radius:50%;opacity:0;animation:frSp 2.4s infinite}
.frsp.s1{top:-4px;left:12%;animation-delay:0s}.frsp.s2{bottom:-4px;right:18%;animation-delay:.8s}.frsp.s3{top:40%;right:-4px;animation-delay:1.6s}
@keyframes frSp{0%,100%{opacity:0;transform:scale(.3)}40%{opacity:1;transform:scale(1.3)}60%{opacity:.8;transform:scale(1)}}
.frph{display:inline-flex;align-items:center;justify-content:center;width:44px;height:48px;background:#1c1a28;border-radius:5px;overflow:hidden;font-size:22px;line-height:1}

.frph.big{width:84px;height:93px;font-size:40px}.frph.sm{width:30px;height:33px;font-size:16px;border-radius:4px}
.frshop{display:flex;gap:10px;align-items:center}.frprev{flex:0 0 auto;padding:4px}
.frlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.frpick{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border:2px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
