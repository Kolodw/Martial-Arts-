# 1 ใน นวนิยาย — ตั้งค่าสำหรับย้ายไป Cloudflare Workers (ยังไม่ได้ใช้ · เว็บจริงยังรันบน Vercel)
# วิธีใช้ดูที่ cloudflare/README.md
name = "martial-arts"
main = "worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# ไฟล์หน้าเว็บ (index.html, รูป, เพลง ฯลฯ) = โฟลเดอร์หลักของ repo · ไฟล์ที่ไม่ควรเปิดให้โหลดอยู่ใน ../.assetsignore
[assets]
directory = "../"
binding = "ASSETS"
html_handling = "drop-trailing-slash"
not_found_handling = "none"

# ที่เก็บเซฟคลาวด์ (R2 bucket "1inanovel" · ไม่เปิดสาธารณะ) — ถ้าไม่มี binding นี้ เกมจะใช้ Valkey เหมือนเดิม
[[r2_buckets]]
binding = "SAVES"
bucket_name = "1inanovel"

# 💳 ฐานข้อมูลคำสั่งซื้อ/สลิป/สิทธิ์ (D1) — ค่าลับ EASYSLIP_KEY ใส่ด้วย wrangler secret put
[[d1_databases]]
binding = "PAY_DB"
database_name = "inanovel-pay"
database_id = "3dcdaad0-8a0e-45dd-bd2b-f372b9c36cf2"

# ให้ Cloudflare ย้ายตำแหน่งรัน Worker ไปใกล้ฐานข้อมูลเอง (ลดเวลาเปิดการเชื่อมต่อ TLS ไป Aiven)
[placement]
mode = "smart"

# 💬 ห้องแชทเรียลไทม์ (Durable Object แบบ SQLite = ใช้ได้ในแพ็กฟรี)
[[durable_objects.bindings]]
name = "CHAT"
class_name = "ChatHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatHub"]

[observability]
enabled = true

# ค่าลับ (ใส่ด้วยคำสั่ง wrangler secret put ไม่ต้องเขียนในไฟล์นี้):
#   VALKEY_URL, ADMIN_KEY, และตัวแปรอื่นที่ตั้งไว้ใน Vercel (ดูรายชื่อใน README)
