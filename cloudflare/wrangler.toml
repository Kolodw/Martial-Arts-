# 1 ใน นวนิยาย — เว็บจริงรันบน Cloudflare Workers ตัวนี้แล้ว (vercel.json เป็นของเก่า ไม่ได้ใช้)
# วิธีใช้ดูที่ cloudflare/README.md
name = "martial-arts"
main = "worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
# กันไม่ให้ deploy ลบตัวแปรที่ตั้งในหน้า Cloudflare (เช่น DISCORD_CLIENT_ID)
keep_vars = true

# บีบไฟล์เกมด้วย Brotli ระดับสูงสุดก่อน deploy (ดู ../tools/br.mjs) · worker.js ส่งไฟล์ .br ให้เบราว์เซอร์ที่รองรับ
[build]
command = "node ../tools/br.mjs"

# ไฟล์หน้าเว็บ (index.html, รูป, เพลง ฯลฯ) = โฟลเดอร์หลักของ repo · ไฟล์ที่ไม่ควรเปิดให้โหลดอยู่ใน ../.assetsignore
[assets]
directory = "../"
binding = "ASSETS"
html_handling = "drop-trailing-slash"
not_found_handling = "none"
# เฉพาะไฟล์ใหญ่ (≥250KB) ให้ผ่าน worker ก่อน — ไฟล์เล็กไม่คุ้มเปลืองโควต้าคำขอ worker เพื่อส่งรุ่นที่บีบแน่นกว่า (ถ้าไม่มีไฟล์ .br จะส่งไฟล์ปกติเหมือนเดิม)
run_worker_first = ["/app.js", "/pfx.js", "/w/mw.js", "/w/late.js", "/w/sky.js", "/w/fan.js", "/w/soul.js", "/w/fog.js", "/w/en.js", "/w/mwb.js", "/w/mwx.js", "/w/upd.js"]

# ที่เก็บเซฟคลาวด์ (R2 bucket "1inanovel" · ไม่เปิดสาธารณะ) — ถ้าไม่มี binding นี้ เกมจะใช้ Valkey เหมือนเดิม
[[r2_buckets]]
binding = "SAVES"
bucket_name = "1inanovel"

# 💳 ฐานข้อมูลคำสั่งซื้อ/สลิป/สิทธิ์ (D1) — ค่าลับ SLIPOK_KEY + SLIPOK_BRANCH (หรือ EASYSLIP_KEY) ใส่ด้วย wrangler secret put · PAY_NAME (ชื่อผู้รับตามสลิป) ใส่เพิ่มได้
[[d1_databases]]
binding = "PAY_DB"
database_name = "inanovel-pay"
database_id = "3dcdaad0-8a0e-45dd-bd2b-f372b9c36cf2"

# ให้ Cloudflare ย้ายตำแหน่งรัน Worker ไปใกล้ฐานข้อมูลเอง (ลดเวลาเปิดการเชื่อมต่อ TLS ไป Aiven)
[placement]
mode = "smart"

# 💬 ห้องแชทเรียลไทม์ (Durable Object แบบ SQLite = ใช้ได้ในแพ็กฟรี)
[[durable_objects.bindings]]
name = "CHAT"
class_name = "ChatHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatHub"]

[observability]
enabled = true

# ⏰ ทุกวัน 12:00 UTC = 19:00 เวลาไทย → push ดึงผู้เล่นที่หายไปกลับมา (action pushre)
[triggers]
crons = ["0 12 * * *"]

# ค่าลับ (ใส่ด้วยคำสั่ง wrangler secret put ไม่ต้องเขียนในไฟล์นี้):
#   VALKEY_URL, ADMIN_KEY, CRON_SECRET (ไม่บังคับ ถ้าไม่ตั้งจะใช้ ADMIN_KEY2), และตัวแปรอื่นที่ตั้งไว้ใน Vercel (ดูรายชื่อใน README)
